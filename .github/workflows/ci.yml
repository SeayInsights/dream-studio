name: PR Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pr-smoke:
    name: pr-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Contract docs drift
        env:
          DREAM_STUDIO_BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: python interfaces/cli/contract_docs_drift_gate.py

      - name: Contract Atlas lifecycle
        env:
          DREAM_STUDIO_BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: python interfaces/cli/contract_atlas_lifecycle_gate.py

      - name: Blast radius gate
        env:
          DREAM_STUDIO_BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: python -m core.gates.blast_radius

      - name: Dashboard truth gate
        run: python -m interfaces.cli.ds doctor dashboard-truth

      - name: Format check
        run: python -m black --check .

      - name: Lint baseline check
        run: python interfaces/cli/lint_baseline.py check

      - name: Dependency vulnerability scan
        continue-on-error: true
        # Accepted dev-only transitive CVEs (via semgrep's click~=8.1.8 / mcp==1.23.3 pins;
        # unfloorable without breaking the Windows install). Kept in sync with the blocking
        # Full-CI security gate in interfaces/cli/ci_gate.py (_ACCEPTED_DEV_CVES).
        run: >
          python -m pip_audit -r requirements-dev.txt -r requirements.txt
          --ignore-vuln CVE-2026-52870 --ignore-vuln CVE-2026-52869
          --ignore-vuln CVE-2026-59950 --ignore-vuln PYSEC-2026-2132

      - name: Stock Windows Store-alias state
        if: runner.os == 'Windows'
        shell: pwsh
        # Out of the box on Windows, bare `python` is the Microsoft Store App Execution
        # Alias: a stub that prints "Python was not found" and exits 9009 without running
        # anything. hooks/hooks.json is a template and ships every hook as bare `python
        # <script>`, so on such a box every Dream Studio hook is dead -- and silently, because
        # a hook that never runs produces no error, only an absence.
        #
        # setup-python hides that state on a runner, which is why no job caught it and the
        # operator's own machine did. This step puts the alias back in front of `python` so
        # the interpreter-resolution tests run in the environment they exist for. They must
        # pass without bare `python` ever resolving.
        run: |
          $real = (Get-Command python).Source
          $shim = Join-Path $env:RUNNER_TEMP 'store-alias'
          New-Item -ItemType Directory -Force -Path $shim | Out-Null
          Set-Content -Encoding ascii -Path (Join-Path $shim 'python.bat') -Value @(
            '@echo off',
            'echo Python was not found; run without arguments to install from the Microsoft Store.',
            'exit /b 9009'
          )
          $env:PATH = "$shim;$env:PATH"
          cmd /c 'python -c "print(1)"' 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 9009) {
            throw "the Store-alias stub is not shadowing bare python (exit $LASTEXITCODE) -- this step would prove nothing"
          }
          & $real -m pytest `
            tests/unit/test_installed_hook_interpreter_resolves.py `
            tests/unit/test_hook_runtime_reliability.py `
            -q --tb=short
          if ($LASTEXITCODE -ne 0) { throw "hooks do not survive the stock Windows Store-alias state" }

      - name: Focused smoke tests
        run: >
          python -m pytest
          tests/unit/test_contract_docs_drift_gate.py
          tests/unit/test_contract_atlas_lifecycle.py
          tests/unit/test_github_pr_cicd_release_gate.py
          tests/unit/test_release_gate_lint_baseline_policy.py
          tests/unit/test_release_gates_dependency_rules.py
          tests/unit/test_gate_fixture_resurrection.py
          tests/unit/test_impact_selection.py
          tests/unit/test_hanging_detectors.py
          tests/unit/test_plugin_dist.py
          tests/unit/test_skill_module_paths_resolve.py
          tests/unit/test_ds_update_skill_drift.py
          tests/unit/test_locale_decode_gate.py
          tests/unit/test_fail_open_probe_gate.py
          tests/unit/test_test_isolation_gate.py
          tests/unit/test_fixture_schema_parity_gate.py
          tests/unit/test_seam_payload_to_projection.py
          tests/integration/test_pr_smoke_impact.py
          -q --tb=short
