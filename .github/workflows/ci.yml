name: PR Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pr-smoke:
    name: pr-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 15 was honest when this job ran sixteen hardcoded files. 30 was too low once the
    # impact step ran the tests a change actually reaches -- a 127-file selection: 4m08s
    # ubuntu, 4m22s macos, 12m05s Windows (~2.8x the other platforms) -- and Windows got
    # through it and was cancelled in the next step. 45 corrected fix/home-means-home's
    # stale 286-test claim to the real 697 once #805's import-graph closure landed, but
    # that correction was measured INSIDE THE REVIEW LANE'S DOCKER CONTAINER on this
    # machine -- a Linux container, despite the host OS being Windows -- so it never
    # actually exercised a Windows Python process. Real GH CI for that same 697-test
    # selection at commits 3528b2e and f1a81bf: "Run the impact set" on windows-latest
    # exceeded 43m14s and was still running when the 45-minute job timeout killed it,
    # both times, while ubuntu-latest/macos-latest finished the identical step in the
    # same run in 18-21m -- a >=2.07x ratio, consistent with the 2.8x already on record.
    # 90 gives real margin past a ~57-minute Windows projection (20m ubuntu * 2.8x) plus
    # setup and the later steps, including the Store-alias step's own pytest run. If
    # this still isn't enough, the fix is real parallelization (pytest-xdist), not
    # another blind bump -- this repo has now bumped this number three times.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Both gates below honor DREAM_STUDIO_CHANGED_FILES as an override that
      # bypasses git-based diffing entirely (a documented escape hatch -- see
      # each gate's own --help). Pinned empty so a value set by an earlier step
      # in this same job (or a self-hosted runner's leftover environment)
      # cannot silently replace real detection -- the same reasoning
      # pre-push.yaml's manifest and ci_gate.py's isolated check env already
      # pin against.
      - name: Contract docs drift
        env:
          DREAM_STUDIO_BASE_REF: origin/${{ github.base_ref || 'main' }}
          DREAM_STUDIO_CHANGED_FILES: ""
        run: python interfaces/cli/contract_docs_drift_gate.py

      - name: Contract Atlas lifecycle
        env:
          DREAM_STUDIO_BASE_REF: origin/${{ github.base_ref || 'main' }}
          DREAM_STUDIO_CHANGED_FILES: ""
        run: python interfaces/cli/contract_atlas_lifecycle_gate.py

      - name: Blast radius gate
        env:
          DREAM_STUDIO_BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: python -m core.gates.blast_radius

      # THE HALF THE BLAST-RADIUS GATE WAS WAITING FOR. It computes the tests this diff
      # reaches "so the matrix step can run the dependent tests"; this is that step. It
      # also runs the sweep tests reference selection cannot see, so it is never empty.
      # Measured on #786: 36 dependent files, ~100s, 4 of 5 main-red failures inside.
      - name: Run the impact set
        env:
          DREAM_STUDIO_BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: python interfaces/cli/impact_tests_gate.py

      - name: Dashboard truth gate
        run: python -m interfaces.cli.ds doctor dashboard-truth

      # Format and lint run in the pre-push gate only. They used to run there AND
      # here AND in full-ci -- three runs, one answer, and this copy burns a full
      # 3-platform round trip to tell you to run `black .`. One home per check.

      - name: Dependency vulnerability scan
        continue-on-error: true
        # Accepted dev-only transitive CVEs (via semgrep's click~=8.1.8 / mcp==1.23.3 pins;
        # unfloorable without breaking the Windows install). Kept in sync with the blocking
        # Full-CI security gate in interfaces/cli/ci_gate.py (_ACCEPTED_DEV_CVES).
        run: >
          python -m pip_audit -r requirements-dev.txt -r requirements.txt
          --ignore-vuln CVE-2026-52870 --ignore-vuln CVE-2026-52869
          --ignore-vuln CVE-2026-59950 --ignore-vuln PYSEC-2026-2132

      - name: Stock Windows Store-alias state
        if: runner.os == 'Windows'
        shell: pwsh
        # Out of the box on Windows, bare `python` is the Microsoft Store App Execution
        # Alias: a stub that prints "Python was not found" and exits 9009 without running
        # anything. hooks/hooks.json is a template and ships every hook as bare `python
        # <script>`, so on such a box every Dream Studio hook is dead -- and silently, because
        # a hook that never runs produces no error, only an absence.
        #
        # setup-python hides that state on a runner, which is why no job caught it and the
        # operator's own machine did. This step puts the alias back in front of `python` so
        # the interpreter-resolution tests run in the environment they exist for. They must
        # pass without bare `python` ever resolving.
        run: |
          $real = (Get-Command python).Source
          $shim = Join-Path $env:RUNNER_TEMP 'store-alias'
          New-Item -ItemType Directory -Force -Path $shim | Out-Null
          Set-Content -Encoding ascii -Path (Join-Path $shim 'python.bat') -Value @(
            '@echo off',
            'echo Python was not found; run without arguments to install from the Microsoft Store.',
            'exit /b 9009'
          )
          $env:PATH = "$shim;$env:PATH"
          cmd /c 'python -c "print(1)"' 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 9009) {
            throw "the Store-alias stub is not shadowing bare python (exit $LASTEXITCODE) -- this step would prove nothing"
          }
          & $real -m pytest `
            tests/unit/test_installed_hook_interpreter_resolves.py `
            tests/unit/test_hook_runtime_reliability.py `
            -q --tb=short
          if ($LASTEXITCODE -ne 0) { throw "hooks do not survive the stock Windows Store-alias state" }

