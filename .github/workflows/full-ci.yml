name: Full CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why the full local parity gate is being run"
        required: true
        default: "manual release-readiness validation"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  full-ci:
    name: full-ci
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # The four real-container tests of the review lane sandbox are install_check tests, so the
      # parity gate's pytest run does not collect them; they ran here when they were plain
      # tests. See the same step in ci.yml for the measurement. ubuntu-latest has Docker.
      - name: Review lane sandbox (real Docker engine)
        run: python -m pytest -m install_check tests/unit/test_lane_sandbox.py -q --tb=short

      - name: Run local parity release gate
        run: python interfaces/cli/ci_gate.py

