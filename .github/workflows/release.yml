name: release

# Native semver release automation (R5 T3). Manually dispatched — cutting a release is a
# human decision — it generates release notes from the conventional commits since the last
# release, bumps the semver version (VERSION + pyproject) and regenerates the plugin +
# marketplace manifests, and opens a release PR for review. No external release action; the
# notes come from core/release/changelog.py. Merging the PR cuts the release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "semver version to release (MAJOR.MINOR.PATCH, e.g. 0.2.0)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Resolve release version + date
        id: ver
        run: |
          VER="${{ github.event.inputs.version }}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Apply release notes + semver version bump + manifest regen
        run: |
          python -m core.release.changelog --apply \
            --version "${{ steps.ver.outputs.version }}" \
            --date "${{ steps.ver.outputs.date }}"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="release/${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "chore(release): ${{ steps.ver.outputs.version }}"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(release): ${{ steps.ver.outputs.version }}" \
            --body "Automated release PR — CHANGELOG + semver version bump (VERSION + pyproject) and regenerated plugin/marketplace manifests for ${{ steps.ver.outputs.version }} (notes derived from conventional commits since the last release). Review and merge to cut the release."
