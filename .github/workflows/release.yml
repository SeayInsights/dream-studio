name: release

# Native CalVer release automation (R5 T3). Manually dispatched — cutting a release is a
# human decision — it generates release notes from the conventional commits since the last
# release, bumps the CalVer version, and opens a release PR for review. No external release
# action; the notes come from core/release/changelog.py. Merging the PR cuts the release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "CalVer version (YYYY.M.D). Blank = today (UTC)."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute CalVer version + date
        id: ver
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then VER="$(date -u +%Y.%-m.%-d)"; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Apply release notes + CalVer version bump
        run: |
          python -m core.release.changelog --apply \
            --version "${{ steps.ver.outputs.version }}" \
            --date "${{ steps.ver.outputs.date }}"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="release/${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "chore(release): ${{ steps.ver.outputs.version }}"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(release): ${{ steps.ver.outputs.version }}" \
            --body "Automated release PR — CHANGELOG + CalVer version bump for ${{ steps.ver.outputs.version }} (notes derived from conventional commits since the last release). Review and merge to cut the release."
