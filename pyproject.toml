[project]
name = "dream-studio"
version = "0.1.0"
description = "Local-first AI orchestration platform for Claude Code and other AI coding assistants."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Dannis Seay" }
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "jsonschema>=4.0",
    "pandas>=2.0,<3.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "Jinja2>=3.1,<4.0",
    "PyYAML>=6.0,<7.0",
    "psutil>=5.9",
    "networkx>=3.0",
    "cachetools>=5.0",
    "fastapi>=0.100,<1.0",
    "uvicorn>=0.23,<1.0",
    "httpx>=0.24",
    "python-multipart>=0.0.6",
    "regex>=2024.9.11",
    "pathspec>=1.1",
]

[project.scripts]
ds = "interfaces.cli.ds:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# compat.py is a top-level module, not a package; eight runtime modules import it.
py-modules = ["compat"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "runtime*", "interfaces*", "spool*", "projections*", "emitters*", "canonical*", "control*", "shared*", "guardrails*", "integrations*", "config", "config.*"]
exclude = ["tests*", "docs*", ".planning*", ".audit*", "*.__pycache__", "*.tests", "*.tests.*"]

# Runtime data that lives INSIDE a package directory ships as package data. "*" covers
# every package (namespace packages included, so canonical/skills/**, the migrations and
# the CLI templates are all reached); the second entry names the one dotfile the runtime
# reads, which "*" does not match.
[tool.setuptools.package-data]
"*" = ["*", ".released_version"]

# Build output and sources the runtime never reads stay out of the wheel.
[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "*.pyo", "*.rs", "Cargo.toml", "Cargo.lock"]

[tool.dream-studio]
# Runtime data that lives OUTSIDE every package, at the repository root. setup.py's
# build_py copies each match into the wheel at the same relative path, so an installed
# code_root() (core.config.paths) has the layout a checkout has and a
# `code_root() / "packs.yaml"` read works unchanged in both. The wheel is meant for a
# dedicated virtual environment (`ds self-install` creates one per app version): its
# top-level packages already have generic names (core, config, runtime, shared).
shipped-root-data = [
    "VERSION",
    "packs.yaml",
    "config.yml",
    "docs/canonical/*.json",
    "docs/contracts/**/*",
    "adapter-projections/**/*",
    "schemas/*.json",
    "templates/**/*",
    "hooks/git/pre-push",
]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests", "analytics/tests"]
asyncio_mode = "auto"
addopts = "-v --color=no"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "runtime_reliability: Phase 5 runtime reliability gate — core contracts that must always pass",
]

[tool.coverage.run]
source = [
    "core",
    "runtime",
    "interfaces",
    "spool",
    "projections",
    "emitters",
    "canonical",
    "control",
]
omit = [
    # omit: example/template files, not production logic
    "projections/core/email/example_usage.py",
    # omit: migration scripts, one-time ops — tests added in 18.7.6
    "core/config/migrations/*",
    # omit: harvest target — tests added in 18.4.3 telemetry workstream
    "core/telemetry/emitters.py",
    # omit: harvest target — tests added in 18.4.3 telemetry workstream
    "core/telemetry/token_capture.py",
]

[tool.coverage.report]
fail_under = 8
