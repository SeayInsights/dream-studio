version: 1.0

# Things to AVOID
avoid:
  - id: bare-name-import-of-hyphenated-file
    pattern: >
      from repo_analyzer import analyze_repositories (or any bare-name import
      of repo-analyzer.py)
    why: >
      repo-analyzer.py's filename has a hyphen, which is not a valid Python
      identifier -- no sys.path arrangement makes `import repo_analyzer` or
      `from repo_analyzer import X` resolve to this file. analyze-repos.py
      shipped with exactly this bare-name import and crashed immediately on
      every invocation with ModuleNotFoundError: No module named
      'repo_analyzer' (fixed in #829).
    instead: >
      Load it by file path: importlib.util.spec_from_file_location
      ("repo_analyzer", <path-to-repo-analyzer.py>), module_from_spec(spec),
      then spec.loader.exec_module(module). See repo-analyzer.py's own
      docstring and analyze-repos.py's top-of-file import for the working
      pattern.
    severity: critical

  - id: climbing-out-of-the-skill-directory
    pattern: >
      Deriving a directory above this skill (a repository root, a checkout
      layout) from Path(__file__) with .parent hops, or importing this skill's
      own modules through a dotted path that names where it sits in a source
      checkout
    why: >
      This skill is installed as a directory of its own, somewhere that has no
      repository root above it and no checkout layout. Two shipped bugs came
      from assuming one. repo-analyzer.py hopped four levels up to a repository
      root and imported the domain registry through a dotted path that spelled
      out where the skill sits in a source checkout; analyze-repos.py hopped five. The hop
      counts were each wrong once (a silent landing on the wrong directory,
      fixed in #829), and the whole approach was wrong everywhere it mattered:
      in an installed copy the import raised ImportError, the surrounding
      `except ImportError` set DOMAIN_SUPPORT = False, --domain silently ran
      the general analysis instead, and --auto-detect crashed with
      "No module named 'canonical'".
    instead: >
      Put this skill's own directory on sys.path (Path(__file__).parent) and
      import its packages by their plain top-level names (domains,
      repo_analysis, analyze_core). Never look above the skill directory. The
      repository's pack-boundary test fails on a reference that does.
    severity: critical

  - id: bare-except-hides-wrong-import-path
    pattern: >
      try: from <wrong.dotted.path> import DomainAnalyzerRegistry / except
      ImportError: DOMAIN_SUPPORT = False
    why: >
      A wrong import inside a broad `except ImportError` is invisible. A
      typo'd dotted path, and later a checkout-only one run outside a
      checkout, was swallowed and just set DOMAIN_SUPPORT = False;
      every domain-specific analysis silently degraded to general analysis
      with no traceback, for as long as it shipped (fixed in #829 and again
      when the dotted path was removed). The same wrong import without the
      except would have been a one-line fix on first run.
    instead: >
      Keep the surrounding except narrow enough that an unrelated ImportError
      elsewhere in the chain does not get misattributed to "domain support
      isn't installed", and run the CLI for real after any import change.
    severity: high

  - id: duplicate-module-identity-via-second-import-route
    pattern: >
      Importing DomainAnalyzerRegistry by a second route (for example a bare
      `from domains.registry import ...` plus `from domains import ...`, or a
      dotted path naming a source checkout) in a process that already loaded
      it through repo-analyzer.py
    why: >
      Two import routes to one file on disk produce two DIFFERENT module
      objects, each with its own independently populated _analyzers dict.
      analyze-repos.py's --auto-detect path once called auto_detect_domain()
      on a SEPARATE DomainAnalyzerRegistry from the one repo-analyzer.py's
      domain-specific analysis uses (found in #829's own review round).
    instead: >
      Take the registry from the loaded repo-analyzer module
      (analyze-repos.py reads _repo_analyzer.DomainAnalyzerRegistry) so there
      is exactly one import route. When two routes could plausibly reach the
      same file, verify with an `is` identity check rather than assuming.
    severity: high

  - id: shadowing-a-platform-package-name
    pattern: >
      Naming a package vendored inside this skill after a package the
      surrounding platform also has (this skill's base-analyzer package was
      called `core`, the same name as Dream Studio's own top-level package)
    why: >
      Whichever package of that name is imported first wins for the whole
      process. With this skill's directory on sys.path, importing the skill's
      copy made every later import of a platform module under that name fail
      with ModuleNotFoundError; with the platform's package already loaded, the
      skill's own base-analyzer import failed instead. The skill only worked by import-order
      accident.
    instead: >
      Vendored packages carry a skill-specific name (analyze_core). A generic
      top-level name inside a skill directory is a collision waiting for the
      next package that wants it.
    severity: high

  - id: broad-substring-marker-matching-on-large-repos
    pattern: >
      Calling DomainAnalyzerRegistry.auto_detect_domain() against a large,
      general-purpose repo root and trusting the winning domain without
      inspecting domain_scores
    why: >
      Marker matching uses repo_path.rglob(f"**/*{marker}*") -- a recursive
      SUBSTRING match against every file name under repo_path, not a targeted
      check for real domain content. On a large monorepo, common words used
      as finance markers (budget, tax, ledger, invoice) turn up somewhere by
      coincidence. Verified directly: pointing auto_detect_domain at a large
      monorepo returns 'finance', not 'general', even though that monorepo is
      not a finance-domain repo.
    instead: >
      Pass verbose=True and inspect domain_scores before trusting
      --auto-detect's answer on anything larger than a small, single-purpose
      repo. Treat a low winning score as inconclusive, not authoritative.
    severity: medium

# Best PRACTICES
best_practices:
  - id: verify-cli-end-to-end-not-just-import
    practice: >
      After changing sys.path or import statements in repo-analyzer.py or
      analyze-repos.py, run both entry points for real from a copy of this
      skill directory placed somewhere that has no repository around it
      (py <copy>/repo-analyzer.py <path> --format json and
      py <copy>/modes/repo/analyze-repos.py <path> --format json), including
      --list-domains, --domain and --auto-detect, rather than trusting that
      the import merely doesn't raise.
    benefit: >
      The `except ImportError` around the domain-registry import means a
      broken import path produces no visible error at all -- only a
      silently-disabled capability. Only an end-to-end run, outside a
      checkout, surfaces that domain support never actually loaded.
    when: Any change to this file's or analyze-repos.py's import/sys.path setup

  - id: vendor-the-dependencies-this-skill-actually-ships-with
    practice: >
      Keep repo_analysis/ (the general pattern-analysis engine), domains/ and
      analyze_core/ as siblings of repo-analyzer.py inside this skill
      directory, not at a repository root.
    benefit: >
      The installed plugin carries this skill directory verbatim and nothing
      outside it -- a dependency living at a repository root never reaches an
      installed Dream Studio even after every import path inside it is fixed.
      This was PR #829's disclosed gap, closed for repo_analysis in #832 and
      for domains when the repository-root import was removed.
    when: Adding any new internal import this skill depends on

# Edge CASES handled
edge_cases:
  - case: the domains package fails to import (missing, broken, or a dependency absent)
    handling: >
      DOMAIN_SUPPORT is set to False and a [WARN] is printed once at import
      time; general SKILL.md pattern analysis still runs normally. A
      --domain request then runs the general analysis instead (the import-time
      [WARN] is the only signal), --list-domains prints "Domain support not
      available", and analyze-repos.py's --auto-detect exits with an error
      naming the cause.
    limitation: >
      This same fallback previously masked the #829 bare-except bug for an
      unknown period -- a silently-disabled capability looks identical, from
      the CLI's output alone, to a deliberately-absent one. Don't read
      "Domain support not available" as expected/normal without checking why.

