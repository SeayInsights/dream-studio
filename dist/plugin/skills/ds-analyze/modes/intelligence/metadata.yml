# Dependencies
# This mode is a thin front for the control.analysis engine, which lives in the Dream
# Studio platform, not in this pack -- so it needs an installed Dream Studio with that
# engine. core_modules lists the engine entry point and the stages it runs; the engine in
# turn imports core.config, core.storage, core.telemetry, core.gates and core.projects
# (recorded as a follow-up: the engine moves into the pack, or behind a CLI door).
# `ds dashboard --open` is how the output template points at the dashboard.
# tools_required: sqlite3 is how reference/error-handling.md inspects pi_analysis_runs.
# files_required is what the engine really writes. The PRD goes to
# ~/.dream-studio/projects/<project-name>/planning/specs/prd.md (core.config.paths.
# project_planning_dir, called from control/analysis/synthesis.py) and into the document
# store; it is NOT written into the analyzed project's .planning/, which the skill text and
# this card said until now. Nothing writes ~/.dream-studio/logs/analysis-errors.log either:
# error-handling.md pointed at a log no code produces, so it is no longer declared.
# These map to the artifact:write and memory:record capability names in
# docs/contracts/pack-capability-contract.md; today they are reached directly, not through it.
dependencies:
  core_modules:
    - control.analysis.engine
    - control.analysis.discovery
    - control.analysis.audit
    - control.analysis.bugs
    - control.analysis.synthesis
    - control.analysis.stacks
  tools_required: [python, git, ds, sqlite3]
  python_packages: []
  env_vars_required: []
  files_required:
    - ~/.dream-studio/state/studio.db
    - ~/.dream-studio/projects/<project-name>/planning/specs/prd.md
  calls_skills: [ds-code-health:debug, ds-core:plan, ds-security:review]

# Compatibility
compatibility:
  min_context_window: 100000
  works_best_with: sonnet
  works_with: [haiku, sonnet, opus]
  platforms: [windows, macos, linux]

# Discovery
