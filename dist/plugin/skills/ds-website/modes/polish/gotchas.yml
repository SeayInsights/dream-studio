# Polish Mode — Gotchas
# Seeded 2026-09-27 from a skill-fleet audit: the critique-vs-polish trigger
# ambiguity (see website/SKILL.md's Pipeline Enforcement Rules and this
# mode's own Purpose section) plus one checklist-listing gap, both verified
# by reading the mode's own files. Remaining empty categories are JIT:
# populate only from a real invocation or audit finding, never speculative
# entries.
version: 1.0

# Things to AVOID
avoid:
  - id: confuse-polish-with-critique
    severity: medium
    discovered: 2026-09-27
    title: "Don't treat polish as the pipeline's own auto-trigger post-build gate"
    context: "This mode's own Trigger line claims it auto-triggers after build page:/build component:, while the pack root's Pipeline Enforcement Rule 4 separately recommends critique for that same moment. They are not the same step: critique is the pipeline's own read-only, opus-scored quality gate tied to the direction lock; polish is the general-purpose critique+fix tool, usable inside or outside a fresh pipeline run."
    fix: "Inside a fresh website pipeline run, run critique first — it's the gate. Reach for polish when you want fixes applied directly, not just a score, or when there is no direction lock to score against."

