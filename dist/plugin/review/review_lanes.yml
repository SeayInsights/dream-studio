# Review lanes — the questions a Dream Studio review is obliged to ask.
#
# WHY THIS FILE EXISTS. Five named reviewers on the platform/gateway pass each found a
# defect nobody else did, and each found it by asking one repeatable question. Those
# questions lived in their heads. Adding them to the review skill's prose would put them
# where the operator has already said guidance goes to die: "a lot of prose laid on top of
# each other as suggestions with no rules, evals, or really any real test that doing
# anything they are supposed to."
#
# THE ROUND TABLE. Every lane is held by a seat, and the seat says what it watches:
#
#   The Warden     is the predicate that admits also the predicate that delivers, or is one
#                  half enforced by nothing?
#   The Machinist  which lane actually runs, on which platform, and how long does it take
#                  when the data is large?
#   The Archivist  does the decision record name every mechanism the code now depends on?
#   The Surveyor   how far from base is this, and is it the tree that ships?
#   The Herald     if a caller sees something different, does the change say so?
#
# These arrived from an external review pass under their finders' real handles. A seat
# anonymises and describes at once, and `_SEATS` in the gate is a closed set — so a lane
# cannot be added under somebody's name, because a name is not a seat.
#
# THE CONTRACT IS THE SAME ONE canonical/rules.yml ALREADY RUNS ON — enforce or declare,
# never advise. Each lane carries exactly ONE of:
#
#   detector:      a runnable `py -m ...` that decides the lane mechanically
#   eval:          a path under tests/evals/ where a grader decides it, with a real fixture
#   judgment: true + why:  neither is possible YET, and `why` names what is missing
#
# `core/gates/review_lane_registry.py` refuses the fourth option. A lane with no
# enforcement key, or two, or a `why` that is a shrug, fails the push. That is the whole
# point: a lane that decays back into advice is a lane that stops being asked.
#
# WHICH LANE IS WHICH WAS MEASURED, not guessed. A detector that fires on hundreds of sites
# is a wall someone switches off; one that fires on nothing is decoration. Every
# `detector:` below carries the count it produced against DS's own tree, and every
# `eval:`/`judgment:` carries the measurement that ruled a detector out. Guessing here is
# how a gate gets written that nobody can keep green.

version: 2
lanes:
  - id: the-other-half-enforced-by-nothing
    seat: "Gate-integrity engineer"
    question: >-
      Two sites decide the same question. Does the second consult every predicate the first does,
      or a subset of them?
    signature: >-
      A fix makes site B "share the predicate" with site A, and shares one of the two that A
      actually requires. The comment claims the two cannot drift; that is true of one predicate
      and false of the pair.
    precedent: >-
      The Warden, plat#814 (blocker-class, and the same defect the Herald had blocked on).
      Delivery shared `_pat_rejected` (revoked-or-expired) with the acceptance paths at
      app/auth.py:393+396 and :409 — but those also require `_user_is_active`, and delivery
      consulted only the first. Reproduced with a control: a disabled account had
      `_pat_rejected=False`, `_user_is_active=False`, auth accepts=False, file written=True. A
      credential was DELIVERED that authentication refuses. The Herald's sentence — "treats
      expired PATs as deliverable even though authentication rejects them" — applied verbatim with
      `disabled` swapped for `expired`.
    measurement: >-
      A DETECTOR WAS PROTOTYPED AND REJECTED ON EVIDENCE. Collecting every private predicate
      consulted in a boolean test across the tree found 421 of them and 26 "subset-suspects" — and
      spot-checking the 26 showed they are arity differences (`_table_exists(conn)` beside
      `_table_exists(conn, table)`), module aliases (`_yaml`), and unrelated decisions in
      different files. The detector has no notion of "the same question", which is the entire
      content of the finding. So this lane is graded, and the number is recorded here so the next
      person does not re-derive it.
    standards:
      - "OpenSSF Scorecard"
      - "SLSA v1.0 Build L2+"
    scope:
      - ".github/workflows/**"
      - "canonical/workflows/**"
      - "core/gates/**"
      - "hooks/**"
      - "runtime/hooks/**"
    eval: tests/evals/test_review_lane_predicate_parity.py
  - id: an-untested-fallback-lane
    seat: "Test-integrity inquisitor"
    question: >-
      This fallback exists because the primary path can be unavailable. Does any test ever enter
      it, or do they all take the primary path?
    signature: >-
      A platform or exception fallback whose tests all run the other branch — so the test that
      validates the fix cannot run on the platform the fallback exists for.
    precedent: >-
      The Machinist, gw#858. `fallback_lock` / `_pending_queue_thread_lock` had zero test hits;
      every ack test ran the flock path. The Windows lane the docstring promised was unexercised.
    measurement: >-
      Deterministic and diff-scoped. Measured 10 candidates across 944 product files with
      name-and-handler detection alone; 14 once an audit forced the detector to also see
      PLATFORM-CONDITIONAL fallbacks, which it had been blind to — and gw#858 was a Windows lane,
      so the detector could not see the shape of its own precedent. Diff-scoped because those 10
      stand today: whole-tree would be a wall on day one, and the backlog drains as those files
      are touched — the ratchet `normative-baseline` and `workflow-node-verification` already use.
    standards:
      - "ISO/IEC/IEEE 29119-4 test techniques"
    detector: py -m core.gates.untested_fallback
  - id: a-per-item-wait-with-no-aggregate-deadline
    seat: "Distributed state and concurrency"
    question: >-
      This wait is bounded per item. How many items can there be, and does anything bound the
      total?
    signature: >-
      A module that already solved unbounded stall for one loop grows a per-item retry in another,
      with no aggregate deadline — so the ceiling multiplies by a data-dependent count and passes
      the timeout the module itself cites.
    precedent: >-
      The Machinist, gw#849 — the strongest finding of the pass. The module's own comment 40 lines
      above the new code says a per-slug ceiling times an agent's skill count is loop stall time,
      and set `_LOCK_BATCH_BUDGET_S = 5.0` for exactly that reason. The new per-card retry was 2
      sleeps x 0.5s inside `for sid in ids:` with no aggregate deadline: ~20s at 20 equipped
      skills, plus the equip retry's own 1.0s, scaling linearly past the 30s timeout the operator
      control surface uses.
    measurement: >-
      Deterministic ONLY once sharpened to the multiplication shape, and the sharpening came from
      a false positive. The first cut — a sleep in a loop, in a module that defines a budget
      constant — found 1 candidate, `core/work_orders/artifacts.py:216`, and reading it showed
      `_LOCK_ATTEMPTS = 4` with a 0.15s backoff: 0.90s worst case, not inside any outer per-item
      loop. Bounded, and not the finding. Requiring NESTING — a sleeping loop inside another loop,
      neither consulting a deadline — drops DS's tree to 0, so this one runs whole-tree rather
      than diff-scoped.
    standards:
      - "CWE-362 race condition"
      - "CWE-367 time-of-check time-of-use"
    detector: py -m core.gates.aggregate_deadline
  - id: a-contract-that-names-one-of-two-mechanisms
    seat: "Contract and protocol"
    question: >-
      The code says mechanisms X and Y make this claim true. Does the contract document name both,
      or only the one that was there first?
    signature: >-
      A normative line is generic enough to stay true while the decision record beneath it still
      names a single mechanism — so availability now rests on two things and the contract admits
      one.
    precedent: >-
      The Archivist. The spec's normative line (GATEWAY-HOSTED-AGENT-SESSION-001:274, "a transient
      failure is absorbed by retrying the fetch") is generic and genuinely true. But ADR-024 point
      4 still says "The equip fetch retries", naming one of the two mechanisms availability now
      depends on, while the code's own docstring says the per-card retry "is what makes
      gw-ADR-024's availability claim true rather than aspirational." Same shape he blocked #837
      on.
    measurement: >-
      MEASURED AS ZERO SUBSTRATE, which is why this is the one lane with no detector and no eval.
      `docs/adr/` contains exactly two files, `ADR-000-template.md` and `README.md` — no decision
      record has been written, so there is nothing for a checker to compare a code claim against.
      A detector would grep for `ADR-\d+` citations, collect the mechanisms citing each, and
      assert the record names them; against zero records it would pass vacuously, which reads like
      enforcement and is not. This lane was ALSO the one an audit caught with no `measurement`
      field at all, while the registry header claimed every lane carries one — so the gate now
      requires it.
    standards:
      - "OpenAPI 3.1"
      - "JSON Schema 2020-12"
      - "RFC 9457 problem details"
      - "Semantic Versioning 2.0.0 for API surface"
    judgment: true
    why: >-
      THERE IS NOTHING TO CHECK AGAINST YET. This lane compares a code claim to the decision
      record it cites, and `docs/adr/` in this repo holds only `ADR-000-template.md` and a README
      — no ADR has been written. A detector would grep for `ADR-\d+` citations, collect the
      mechanisms citing each one, and assert the ADR names them; with zero ADRs it would pass
      vacuously, which is worse than an honest declaration. Convert this lane the moment the first
      real ADR lands.
  - id: a-branch-behind-its-base
    seat: "Merge-order steward"
    question: >-
      How far behind its base is this branch, and did anyone ask it to sync?
    signature: >-
      A PR that trial-merges clean while being far enough behind that the review read a tree
      nobody will ship.
    precedent: >-
      The Surveyor. In the pasted pass plat#812 and #814 were 38 commits behind and gw#849 and
      #858 were 5 behind; all four trial-merged clean, and the Herald asked #812 to sync
      explicitly. Clean trial-merge is not currency.
    measurement: >-
      Trivially deterministic — `git rev-list --count HEAD..origin/main` — and currently PROSE:
      CLAUDE.md says "Never push to stale/old branches — check branch freshness first", enforced
      by nothing. ADVISORY rather than blocking, because a deliberately behind branch is
      legitimate (a revert, a hotfix off a tag) and blocking it would be a wall; the lane's job is
      that nobody reviews a stale tree without knowing it.
    detector: py -m core.gates.branch_freshness
  - id: an-unenumerated-behaviour-change
    seat: "Claim and closure auditor"
    question: >-
      What does a caller see differently after this change, and does the change say so?
    signature: >-
      A response contract changes — a status code, a new raise on an existing path, a changed
      return type — and the PR body enumerates everything except that.
    precedent: >-
      The Herald, gw#858. A second ack now raises instead of returning 200, and the consumer is
      the local UI. The change was real, the body did not name it.
    measurement: >-
      A SIBLING OF AN EXISTING GATE, not a new one. `evidence-backed-output` already audits what a
      push publishes — the commit messages of the commits being pushed and the lines added to
      CHANGELOG.md — so the mechanism for "the outbound document must say it" exists. What is
      missing is the diff side: recognising that a 200 became a raise. That half is graded for now
      because "what a caller sees differently" is not decidable from a textual diff in general,
      and the honest move is to extend the existing gate rather than stand up a second one that
      audits the same documents.
    standards:
      - "Conventional Commits 1.0.0"
      - "Keep a Changelog 1.1.0"
    eval: tests/evals/test_review_lane_behaviour_change_enumerated.py
  - id: a-produced-value-with-no-reader
    seat: "Observability and audit trail"
    question: >-
      A value is produced and honestly computed. Does anything actually read it, and when nothing
      does, what does the default say in its place?
    signature: >-
      A producer returns several fields; the consumer destructures one. The unread field would
      have said "still loading" or "the request failed", so a fallback speaks instead -- and the
      fallback MAKES A POSITIVE CLAIM. A placeholder reading "no_data" is indistinguishable from a
      real measurement of nothing, so a broken fetch and an empty result render identically. A
      fallback admitting "unknown" would be untidy; one asserting a measurement is the
      compared-nothing-reported-clean family.
    precedent: >-
      The Interpreter, an external review pass. A fetch hook returned `{get, isLoading,
      stateById}` and both views destructured only `get`, so `isLoading` and `stateById` had no
      production consumer and a failed fetch drew a hollow radar claiming "measured, nothing
      found". An earlier review of the same code had reasoned that a spinner keyed off `isLoading`
      would hang forever; the finder checked and there was no spinner. In this repo the same shape
      is WO 48bd8ab3 (2026-09-09): `contract_docs_drift_gate` filtered domains on `status`, a key
      the dicts do not carry (they carry `freshness_status`), so `record_gate_bypass` was
      unreachable -- 350 recorded bypasses across 16 gates and zero for docs-drift.
    measurement: >-
      A DETECTOR WAS PROTOTYPED AND REJECTED ON EVIDENCE. Collecting every string key returned in
      a dict literal across `git ls-files '*.py'` and subtracting every key read anywhere as a
      subscript, a `.get()`/`.pop()`/`.setdefault()` argument or an `in` test measured 2108
      distinct keys produced, 588 never read in-tree, across 198 files. Sampling showed why that
      count is a wall rather than a finding: most are API response fields consumed by the
      dashboard, or keys serialised to JSON for a reader outside Python entirely. A consumer in
      another language is invisible to the analysis, which is precisely the shape of the precedent
      -- a React view reading a Python-shaped hook -- so a detector would fire 588 times and still
      miss the instance that created the lane. Graded against a fixture instead.
    standards:
      - "OWASP ASVS v4.0 V7 Error Handling and Logging"
      - "OWASP Top 10 A09:2021 Security Logging and Monitoring Failures"
      - "NIST SP 800-92 log management"
      - "OpenTelemetry semantic conventions"
    eval: tests/evals/test_review_lane_value_reaches_a_reader.py
  - id: a-status-the-far-end-does-not-handle
    seat: "Failure semantics"
    question: >-
      The producer's vocabulary has more members than the consumer has branches. What does the
      consumer render for the member it does not know?
    signature: >-
      A status enum grows a member -- or always had one -- and the consumer branches on the ones
      it knows and lets the rest fall to a default. The default is a MEMBER OF THE SAME VOCABULARY
      rather than an error, so the unknown status renders as a different, plausible reading
      instead of failing. Checking that the KEYS match the producer is what makes this easy to
      miss: the envelope is verified and the meaning inside it is not.
    precedent: >-
      The Interpreter, the same external review pass. `measure_network_reliability` emits
      `not_applicable` today for agents that do not heartbeat; the radar renderer branched on its
      known statuses and let the rest fall through to a numeric zero, drawing a normal-weight
      spoke to the centre vertex -- reading as 0% uptime for an agent whose uptime was never
      measurable. The finder's diagnosis: "I checked that the six axis keys matched the server and
      never asked what the statuses render as."
    measurement: >-
      SEPARATED FROM ITS SIBLING LANE DELIBERATELY, after asking what each remedy is: there the
      consumer does not exist and the fix is to add one; here the consumer exists and is wrong,
      and the fix is to make its branch set match the producer's vocabulary or fail loudly on a
      member it does not know. One lane answering both would carry two questions and one verdict,
      which is how a lane stops being falsifiable. Graded for the same measured reason as the
      sibling -- the 588-of-2108 analysis that cannot see a non-Python consumer cannot see a
      non-Python branch set either -- and additionally because a vocabulary member can arrive from
      a database column, a config file or a provider's API without appearing as a literal
      anywhere, so a detector restricted to the both-sides-Python case would pass on the very
      shape that produced the finding.
    standards:
      - "CWE-703 improper check or handling of exceptional conditions"
      - "CWE-754 improper check for unusual conditions"
      - "Saltzer and Schroeder fail-safe defaults"
    eval: tests/evals/test_review_lane_status_survives_translation.py
  - id: a-test-that-cannot-fail
    seat: "Test-integrity inquisitor"
    question: >-
      This test is green. Show me it going red — what does it look like when the thing it guards
      is broken?
    signature: >-
      A test with assertions on computed values, reading as thorough, whose verdict does not
      actually depend on the thing it tests. It passes against the correct code AND against the
      defect it claims to catch. Often it has MORE assertions than a real test of the same
      subject, which is why "it has assertions" and "it can fail" get confused. Two ordinary
      shapes: it only ever passes inputs that should succeed, so the refusing branch is never
      exercised; or it asserts on a value the test itself constructed rather than on the subject's
      answer.
    precedent: >-
      The most productive family in this repo, and every instance was found by an independent
      auditor rather than by the suite containing it. WO a9fa2368: a non-mutation test hashed the
      live database's FILE BYTES, so it failed WITHOUT a mutation (WAL checkpointing rewrites
      those bytes on a benign read) and could not fail FOR the real reason (conftest redirects the
      database session-wide, so nothing in pytest reaches the live file) -- proved by removing the
      override and watching a connection-recording version still pass. WO 5db3755e: a control test
      asserted a hand-typed table of booleans against itself, never executing the fixture it
      claimed to reproduce; two further tautologies passed under a checker mutated to report
      nothing. WO eac7f657: a coverage report and the executor shared a PATTERN but each applied
      it, and deleting the report's own `.strip()` left all 30 of its tests green while an
      indented ` TEST-CHECK: x` became a criterion the executor runs and the report calls prose.
    measurement: >-
      TWO STATIC SHAPES WERE PROTOTYPED AND BOTH REJECTED. Across 6249 test functions, 79 have no
      assertion of any kind and 3 assert only on literals. Both populations are almost entirely
      legitimate: the 79 are `tests/evals/test_dependency_chain.py`'s deliberate `*_unknown` /
      `*_untested` markers, which exist to record what is NOT covered, and the 3 are intentional
      probes for other gates. Decisively, zero of the real instances above would have been caught
      -- every one had assertions on computed values. A detector would flag 82 legitimate tests
      and none of the defects, which is a wall and decoration at once. The only reliable answer is
      to mutate the subject and watch, which is a reviewer's act rather than a gate's.
    standards:
      - "ISO/IEC/IEEE 29119-4 test techniques"
    eval: tests/evals/test_review_lane_a_test_that_cannot_fail.py
  - id: a-write-no-event-can-reconstruct
    seat: "Event-substrate custodian"
    question: >-
      If this record were rebuilt from its events tomorrow, would it still be here?
    signature: >-
      A row written straight into a projection table, with no canonical event beside it. Nothing
      fails and the row reads as durable, because the projection is a real table and the write
      really happened -- but `pre_rebuild` truncates that table before replaying events, so a
      replay cannot reconstruct what no event describes. Often arrives by copying a sibling write
      site rather than the designated writer.
    precedent: >-
      The Custodian, WO 17466550, measured 2026-09-10: 493 of 949 work orders and 1706 of 3286
      tasks in the live authority carry no creation event, so a rebuild deletes 52% of both -- and
      a rebuild is the disaster-recovery tool, so the defect bites hardest exactly when it is
      reached for. Verified by resolution rather than by reading the comment that asserts it:
      `pre_rebuild` is absent from both projections' `__dict__` and both bind to
      `framework_projection.py`, whose default does `DELETE FROM` each declared target. The source
      was one unfixed sibling -- `_insert_gap_work_orders` writes both tables with no event, while
      `_attach_gap_tasks` was fixed and carries a comment saying its author "copied the shape of
      the sibling-spawn INSERT instead of the task-creation path in mutations.py", naming this
      exact function as the wrong shape and never returning to it. Related: WO a08206a9, where
      ownership records SHAs that squash-merge discarded (10 of 35 on one work order), and WO
      6935afa5, where a drain writes status with no event.
    measurement: >-
      A DETECTOR, AND THE COUNT IS WHY. The target tables are DERIVED from each projection's own
      `target_tables` declaration -- the set `pre_rebuild` truncates, so the actual blast radius
      -- which measures 6 tables rather than the 2 this defect was found in; a hardcoded list
      would have exempted the other 4, the same subset-of-what-it-writes shape as WO b56cca8a.
      Across the tree, 214 functions INSERT into one of those tables and 211 emit no event, but
      only 4 are outside `tests/`: a fixture building rows directly is what a fixture IS, so tests
      are out of scope. Of the 4, three are `prove`'s DISPOSABLE scratch authority (declared at
      the site, since emitting there would write the operator's live spool -- the defect WO
      8bd297f1 fixed, 4194 connections measured) and one is the genuine finding. So the gate
      reports exactly 1, which is small enough to hold at zero. ADVISORY until WO 17466550 fixes
      that write, because a blocking gate that ships red teaches people to bypass it.
    detector: py -m core.gates.event_backed_write
  - id: a-channel-outside-the-accounting
    seat: "Untrusted input and abuse limits"
    question: >-
      What is the full capability surface of the thing being guarded, independent of what the
      guard says about itself?
    signature: >-
      A guard declares its dimensions -- caps, allowed values, a rule -- and enforces every one
      correctly. The adversarial inputs are derived from that list, so they all probe stated
      limits and all get refused, and the review reports the guard safe. The defect is a mechanism
      of the underlying FORMAT or LIBRARY that the guard's accounting never sees: bytes consumed
      and expanded internally before anything is handed back, so no accounting the caller writes
      can count them. Three variants of one shape: verifying that a rule is ENFORCED rather than
      whether the rule is RIGHT; verifying a producer's transitions rather than what RENDERS;
      verifying the caps a guard DECLARES rather than a channel outside its accounting. Each time
      the review took its frame from the artifact under review.
    precedent: >-
      The Cartographer, an external review pass on `_declaration_members`. A reviewer built ten
      archives -- a member over the per-member cap, members summing past the total cap, more
      members than the member cap, the wrong container, empty bytes -- ran them through the guard
      and wrote "Ten for ten, on both container formats... genuinely safe rather than merely
      bounded." PAX headers and GNU long-name were reachable the whole time, because `tarfile`
      consumes and expands the header internally and yields only the regular member, so
      `member.isfile()` never sees it. Every one of the ten cases was derived from a limit the
      guard declares, and PAX is not a way to exceed a declared cap. THREE PASSES MISSED IT -- the
      author twice, plus a review of this module specifically for security -- and it was found by
      reasoning about `tarfile` rather than about the guard, which is what makes it a missing
      question rather than a lapse. The recorded correction: derive adversarial inputs from the
      parser's capability surface (PAX, GNU long-name/long-link, sparse members, nested
      compression), not the guard's rule list.
    measurement: >-
      A DETECTOR WAS PROTOTYPED, MEASURED SMALL, AND REJECTED ANYWAY -- for a better reason than
      volume. For each format this repo parses in production, it asked whether the test corpus
      mentions that format's documented side channels: 4 formats, being csv (5 production sites, 0
      of 3 channels named in tests), json (275 sites, 1 of 4), yaml (43 sites, 3 of 5) and zipfile
      (3 sites, 1 of 4). Four rows is actionable, not a wall, and it did surface a real gap. It is
      not shipped because THE SIGNAL IS A GREP STANDING IN FOR A DRIVE: "the string 'pax' occurs
      somewhere under tests/" is not evidence that any guard was ever driven with a PAX header,
      and that substitution is precisely what `core/gates/deterministic_evidence.py` exists to
      report -- a gate committing the defect the repo already has a gate against would report
      coverage this repo does not have. Neither is the lane a detector by nature: the capability
      surface of a library is documented in the library, and no static read of this repo can
      enumerate what `tarfile` does with bytes it never yields.
    standards:
      - "OWASP ASVS v4.0 V5 Validation, Sanitization and Encoding"
      - "OWASP Top 10 A03:2021 Injection"
      - "CWE-22 path traversal"
      - "CWE-409 decompression bomb"
    eval: tests/evals/test_review_lane_the_surface_outside_the_rules.py
  - id: chair-and-verdict-owner
    seat: "Chair and verdict owner"
    question: >-
      What is the single merge recommendation here, and is every finding's severity calibrated
      against it rather than stated in isolation?
    signature: >-
      Many opinions and no verdict. Findings arrive at assorted severities with nothing
      reconciling them, so the author receives twenty-seven views instead of one decision and
      picks whichever is cheapest.
    precedent: >-
      The review history already speaks this way -- 'Merge recommendation: request changes' -- so
      the verdict is an existing artefact, not a new ceremony.
    measurement: >-
      Severity calibration is a judgement across a whole review; there is nothing to count in a
      single diff, and a detector that fired per-finding would be grading the parts while the seat
      exists to grade the whole.
    judgment: true
    why: >-
      A verdict is one recommendation over a set of findings that do not exist until the other
      seats have run, so nothing can be computed from the diff alone. It becomes an eval once
      convene() returns a finding set worth grading.
  - id: evidence-referee
    seat: "Evidence referee"
    question: >-
      Which SHA and which command prove this claim, and does reverting the fix actually turn the
      check red?
    signature: >-
      A claim with no reproduction. The author's summary is taken as the finding, the fix is read
      rather than run, and nobody checks that the guard fails when the guarded thing is broken.
    precedent: >-
      platform#850's mutation table: enforcement verified adversarially by reverting the fix and
      requiring red, rather than by reading the diff. 1,185 units.
    measurement: >-
      Whether a claim carries a reproduction is checkable in the review artefact, but whether the
      reproduction PROVES the claim requires running it against a mutated tree, which is a graded
      exercise rather than a static scan.
    judgment: true
    why: >-
      No review artefact in this repo yet carries a per-finding reproduction command, so there is
      no field to check. It becomes an eval the moment a verdict records the command that proves
      each finding -- which is this seat's own first deliverable.
  - id: reviewer-s-reviewer
    seat: "Reviewer's reviewer"
    question: >-
      Does every finding still hold against current HEAD, and which ones should be withdrawn?
    signature: >-
      A finding that was true at review time and is false now, or was never true. Nobody
      re-checks, so the author argues with a stale objection and the reviewer's overreach costs
      more than the defect.
    precedent: >-
      sarob's withdrawn ADR renumber on platform#850 and markgalpin's self-correction on
      dogfood-appliances#17. 215 dismissed reviews is this function happening informally.
    measurement: >-
      Re-checking a finding means re-running its own check at a newer commit, which the finding
      must carry to be re-checkable at all -- so this seat depends on the Evidence referee's
      output and is graded on the pair.
    judgment: true
    why: >-
      It audits other seats' findings, which do not exist until they have run, so it has no input
      at diff time. It becomes an eval once a verdict carries per-finding reproductions that can
      be replayed at HEAD.
  - id: authz-and-identity
    seat: "AuthZ and identity"
    question: >-
      Which principal is this, what may it do, and what happens to the sessions that already exist
      when that answer changes?
    signature: >-
      Permission derive-and-intersect that widens, a token class mistaken for another, admin scope
      acquired by a path nobody enumerated, or a lifecycle where revocation does not revoke.
    precedent: >-
      platform#846's principal and token-class confusion; platform#533, where re-enabling an
      account resurrects JWTs issued before it was disabled. Largest single theme at 3,245 units.
    measurement: >-
      Deriving the effective permission set needs the authorization model, not the diff -- two
      intersecting grants are correct or catastrophic depending on the principal, which no static
      scan of a changed file can decide.
    standards:
      - "OWASP ASVS v4.0 V4 Access Control"
      - "OWASP Top 10 A01:2021 Broken Access Control"
      - "NIST SP 800-63B session lifecycle"
    judgment: true
    why: >-
      There is no machine-readable authorization model in this repo to diff a change against. It
      becomes a detector the day the permission derivation is expressed as data rather than as
      code paths.
  - id: secrets-and-data-at-rest
    seat: "Secrets and data-at-rest"
    question: >-
      Where does this secret come to rest, who can read it there, and what rotates it?
    signature: >-
      A credential written somewhere durable with the wrong mode or the wrong scope -- a cluster
      dump in plaintext, a secret store with no condition, a PAT seeded into a script that ships.
    precedent: >-
      platform#595's plaintext cluster dumps and file modes; release#140's unconditioned
      ClusterSecretStore. 485 records.
    measurement: >-
      High-entropy strings are detectable and the existing security-scan gate finds them; what
      this seat adds is scope and rotation, which are properties of the deployment rather than of
      the text.
    standards:
      - "OWASP ASVS v4.0 V6 Stored Cryptography"
      - "CWE-312 cleartext storage of sensitive information"
      - "NIST SP 800-57 key management"
    scope:
      - "**/*.env*"
      - "**/secret*"
      - "**/*credential*"
      - ".github/workflows/**"
    judgment: true
    why: >-
      Scope and rotation live in cluster and provider configuration this repo does not contain, so
      there is nothing local to compute against. The literal-secret half is already covered by the
      security-scan gate.
  - id: supply-chain-and-provenance
    seat: "Supply chain and provenance"
    question: >-
      What exactly is being installed and published here, and does the identity signing it match
      the identity that built it?
    signature: >-
      A lockfile valid on the branch and invalid on the merge, a tag where a digest was meant, a
      signature check that trusts any dispatch ref, or a name that resolves to somebody else's
      package.
    precedent: >-
      fulcrum-gateway#811 publishing and attesting under one identity; platform#647's signature
      verification trusting any dispatch ref; the third-party fulcrum PyPI name. 1,421 units.
    measurement: >-
      Pinning and digest-versus-tag are mechanically checkable and worth a detector later;
      provenance -- whether the signing identity is the building identity -- needs the workflow's
      runtime trust relationships.
    standards:
      - "SLSA v1.0"
      - "NIST SP 800-218 SSDF"
      - "OpenSSF Scorecard"
      - "SPDX or CycloneDX SBOM"
      - "Sigstore signature verification"
    scope:
      - "requirements*.txt"
      - "**/*.lock"
      - "package.json"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "**/uv.lock"
    judgment: true
    why: >-
      Requires resolving registry and workflow identities outside this repo. The pinning half
      could become a detector over lockfiles and action refs without waiting for the rest.
  - id: cloud-iam-and-iac
    seat: "Cloud IAM and IaC"
    question: >-
      Which external identity can assume this role, and what can it reach once it has?
    signature: >-
      An OIDC trust subject matched loosely, a policy pairing CreateRole with PassRole on a
      wildcard resource, an unpinned provider, or a default region that silently places data
      elsewhere.
    precedent: >-
      release#7's Azure exact-subject requirement; privilege-escalation primitives from Resource
      '*'; demo#6's region defaults. 315 records, nearly all in release.
    measurement: >-
      Trust-policy subject matching is checkable against a declared allowed set, and would make a
      detector -- but this repo ships no Terraform or cloud IAM, so a detector here would examine
      zero sites and report clean forever.
    standards:
      - "CIS Benchmarks"
      - "NIST SP 800-53 AC family"
      - "CWE-269 improper privilege management"
    scope:
      - "*.tf"
      - "*.tfvars"
      - "**/terraform/**"
      - "**/*iam*"
    judgment: true
    why: >-
      No IaC in this repository for a detector to examine, and a detector that examines nothing
      reports clean, which is the compared-nothing-reported-clean shape this registry exists to
      refuse.
  - id: gitops-and-rollout-safety
    seat: "GitOps and rollout safety"
    question: >-
      What is the blast radius when this reconciles automatically, and what does prune remove that
      nobody listed?
    signature: >-
      Automation whose failure mode is deletion. Self-heal and prune acting on an incomplete
      inventory, or an optional mount that silently disables a provider rather than failing.
    precedent: >-
      release#185, where an automated prune could remove a working HTTPS endpoint; optional: true
      secret mounts disabling a provider quietly.
    measurement: >-
      Blast radius depends on live cluster inventory, which is not in the diff; the same manifest
      is safe or destructive depending on what is deployed.
    standards:
      - "CIS Kubernetes Benchmark"
      - "NIST SP 800-190 container security"
    scope:
      - "**/k8s/**"
      - "**/helm/**"
      - "**/kustomize/**"
      - "**/charts/**"
      - "**/zarf*"
    judgment: true
    why: >-
      Needs cluster state to compute what a prune would remove. Dream Studio ships no GitOps
      manifests today, so this seat is registered for projects that do rather than for this one.
  - id: release-and-version-model
    seat: "Release and version model"
    question: >-
      Does the version this produces mean what the ecosystem consuming it thinks it means?
    signature: >-
      A tag treated as a release, an upgrade task scaffolded and presented as validation, or a
      version string that is legal here and illegal to the platform that reads it.
    precedent: >-
      dogfood-appliances#33 treating 'tag exists' as 'content released'; release#138's scaffolded
      upgrade tasks presented as validation; Apple's numeric CFBundleShortVersionString. 452
      records.
    measurement: >-
      Version-format law is per-ecosystem and mechanically checkable where the ecosystem is known;
      the harder half -- whether a tag means a release -- depends on the publishing pipeline's own
      semantics.
    standards:
      - "Semantic Versioning 2.0.0"
      - "Keep a Changelog 1.1.0"
    scope:
      - "**/.released_version"
      - "**/version*"
      - ".github/workflows/**"
      - "CHANGELOG.md"
    judgment: true
    why: >-
      The format rules differ per target ecosystem and this repo publishes to none of them yet.
      The released-version sentinel is already guarded by its own migration gate.
  - id: data-and-migration
    seat: "Data and migration"
    question: >-
      Does this migration go forward and back, and does the schema still hold every invariant
      afterwards?
    signature: >-
      Forward-only in practice, numbering that collides or skips, a constraint relaxed to make a
      migration pass, or orphan rows nobody counted.
    precedent: >-
      platform#848, the migration-hygiene guard itself. 834 units.
    measurement: >-
      Numbering, contiguity and rollback presence are mechanically checkable and this repo already
      has migration gates covering them; what remains is whether the data still means the same
      thing, which is graded.
    standards:
      - "ACID transaction properties"
      - "ISO/IEC 9075 SQL constraints"
    scope:
      - "**/migrations/**"
      - "**/*.sql"
      - "core/event_store/**"
    judgment: true
    why: >-
      Dream Studio already runs migration-risk and migration-authority gates for the mechanical
      half. This seat exists so the semantic half -- does the row still mean what it meant -- has
      somewhere to be asked.
  - id: design-system-conformance
    seat: "Design-system conformance"
    question: >-
      Does this component take the promotion path, and does the styling actually reach the
      browser?
    signature: >-
      A token bypassed for a raw value, a component that never enters the barrel, or a stylesheet
      that is written, reviewed, merged, and never served.
    precedent: >-
      platform#709: a 625-line stylesheet that never reached the browser. 1,545 units.
    measurement: >-
      Token-versus-raw-value and barrel export are both greppable and would make a detector in a
      repo with a design system; whether the CSS is delivered needs a build, which is the half
      that actually bit.
    standards:
      - "W3C Design Tokens Community Group format"
    scope:
      - "**/*.css"
      - "**/*.scss"
      - "**/*.tsx"
      - "**/*.jsx"
    judgment: true
    why: >-
      Dream Studio ships no design system or frontend bundle, so a detector would examine zero
      sites. Registered for the projects the round table is called from, not for this one.
  - id: accessibility
    seat: "Accessibility"
    question: >-
      Can this be operated without a mouse, and does every control have a name a screen reader
      will say?
    signature: >-
      An ARIA ownership tree that does not match the visual one, a collapsed nav whose controls
      lose their accessible names, a tooltip with no association and no Escape.
    precedent: >-
      platform#713's ARIA ownership trees. Real but thin at 71 records -- essentially one reviewer
      on one stack, which is itself the finding.
    measurement: >-
      Automated accessibility checking is mature and would be a detector in a repo with markup; 71
      records across one reviewer says the coverage gap is human, not tooling.
    standards:
      - "WCAG 2.2 Level AA"
      - "WAI-ARIA 1.2"
      - "EN 301 549"
      - "Section 508"
    scope:
      - "**/*.html"
      - "**/*.tsx"
      - "**/*.jsx"
      - "**/*.vue"
    judgment: true
    why: >-
      No rendered markup in this repository to check. The thinness of the evidence -- one
      reviewer, one stack -- is the reason to register the seat rather than a reason to skip it.
  - id: frontend-behavior-and-payload
    seat: "Frontend behavior and payload"
    question: >-
      Does this control do what it looks like it does, and what did it cost to download?
    signature: >-
      A control that looks live and is dead, a hooks-rules violation that only shows under a
      specific render order, or a payload nobody measured.
    precedent: >-
      platform#817's search field that looked functional and was inert; platform#834's 903 KiB
      reduction. 2,371 units combined.
    measurement: >-
      Bundle size is measurable in CI and hooks rules are lintable; the looks-live-and-is-dead
      class needs a rendered page, which is where the expensive findings were.
    standards:
      - "WCAG 2.2 Level AA"
      - "Core Web Vitals"
    scope:
      - "**/*.tsx"
      - "**/*.jsx"
      - "**/*.ts"
      - "**/*.js"
      - "**/*.css"
    judgment: true
    why: >-
      No frontend in this repository. Registered so a project convening this table from its own
      tree is asked the question, which is the reason the table was made portable.
  - id: cli-and-operator-ergonomics
    seat: "CLI and operator ergonomics"
    question: >-
      Can an operator run this from a clean box using only what the docs say?
    signature: >-
      Help text that contradicts the defaults, a deprecated alias the documentation still
      recommends, an exit code that reports success on failure, or a runbook with a missing step.
    precedent: >-
      fulcrum-gateway#645's deprecated aliases still recommended by docs; fulcrum-gateway#215's
      help text contradicting defaults. 641 records.
    measurement: >-
      Help text can be diffed against declared defaults mechanically, and Dream Studio is
      CLI-first, so this is the seat most likely to earn a real detector next -- it is judgement
      only because nobody has built it yet.
    standards:
      - "POSIX Utility Syntax Guidelines (IEEE Std 1003.1)"
      - "GNU coding standards for command-line interfaces"
    scope:
      - "interfaces/cli/**"
      - "**/*runbook*"
      - "docs/operations/**"
    judgment: true
    why: >-
      Comparing help text against actual default values needs a parse of both, which is buildable
      here and simply is not built. This is the strongest detector candidate on the bench.
  - id: agent-and-plugin-runtime
    seat: "Agent and plugin runtime"
    question: >-
      What does this cap or namespace do to the model rather than to the operator?
    signature: >-
      A limit that misleads the thing consuming it. A silent truncation the agent reads as the
      whole input, a manifest placeholder that ships, an allowlist that widens a profile nobody
      reviewed.
    precedent: >-
      fulcrum-gateway#18's silent 10,000-byte truncation misleading the model;
      fulcrum-gateway#648's MCP allowlists in agent profiles. 824 records.
    measurement: >-
      Manifest and placeholder checks are mechanical; the load-bearing half -- a cap that misleads
      the model -- requires knowing what the consumer infers from a truncated value, which is
      judgement.
    scope:
      - "canonical/skills/**"
      - "canonical/agents/**"
      - ".mcp.json"
      - "integrations/marketplace/**"
    judgment: true
    why: >-
      Whether a truncation misleads depends on what the consumer infers from it, and the consumer
      is a model. Registered because Dream Studio is an agent runtime and this is its own failure
      surface.
  - id: mission-domain-consequence
    seat: "Mission-domain consequence"
    question: >-
      Weighted by mission effect rather than code severity, what is the worst thing this change
      permits?
    signature: >-
      A control enforced as vocabulary rather than as a ceiling. A marking that does not follow
      the data, a dissemination rule that is advisory, an air-gap assumption contradicted by a
      default URL.
    precedent: >-
      platform#504's classification ceilings enforced as vocabulary; platform#673's map toggling a
      CUI layer and marking nothing, called the highest-weighted finding in that review;
      fulcrum-gateway#53's default SaaS URLs.
    measurement: >-
      Mission weight is the seat's whole point and is not derivable from code -- the platform#673
      finding was low code-severity and highest mission-severity, which no measurement of the diff
      would have surfaced.
    standards:
      - "32 CFR Part 2002 CUI"
      - "DoDI 5200.48 CUI marking"
      - "NIST SP 800-171"
      - "EO 13526 classification"
    judgment: true
    why: >-
      Mission consequence is an external judgement about what the software is used for, and cannot
      be computed from the change. It is the one seat where a human re-weighting the others is the
      mechanism.
  - id: governance-canon-and-board
    seat: "Governance canon and board"
    question: >-
      Does this contradict another document that is also in force?
    signature: >-
      Two canonical documents authorizing and forbidding the same act, an ADR edited rather than
      superseded, or canon propagated to one repo and not its siblings.
    precedent: >-
      planning#28, where CONTRIBUTING authorized what TRIAGE forbade. 735 records.
    measurement: >-
      Cross-document contradiction needs the semantics of both documents; ADR immutability and
      numbering are mechanical and this repo already gates the numbering half.
    standards:
      - "ISO/IEC/IEEE 42010 architecture description"
    scope:
      - "docs/**"
      - "canonical/**"
      - "*.md"
    judgment: true
    why: >-
      Detecting that two documents contradict each other requires reading both for meaning. The
      mechanical half -- ADR numbering and immutability -- is already covered by existing docs
      gates.
  - id: docs-style-and-attribution
    seat: "Docs, style, and attribution"
    question: >-
      Does anything shipping here carry a name, a path, or a trailer that should not leave this
      machine?
    signature: >-
      AI attribution trailers on commits, a personal absolute path in a shipped file, a required
      section missing from SECURITY.md, or an entry-point link that 404s.
    precedent: >-
      dogfood-appliances#2's PII and personal paths shipping to contractors; demo#60's 404ing
      entry-point links. This repo removed five Co-Authored-By trailers from main on 2026-09-10
      for exactly this reason.
    measurement: >-
      Every one of these is mechanically checkable and Dream Studio already gates most of them --
      operator_absolute_path, docs-drift and the atlas-leak gate -- so the detector here is
      aggregation rather than new detection.
    standards:
      - "Diataxis documentation framework"
      - "Keep a Changelog 1.1.0"
      - "SPDX licence identifiers"
    scope:
      - "docs/**"
      - "*.md"
      - "**/*.md"
    judgment: true
    why: >-
      The constituent checks exist as separate gates already; what is missing is one lane that
      names them as a family so a new member is added here rather than invented somewhere else.
  - id: code-quality-and-structure
    seat: "Code quality and structure"
    question: >-
      Is this reachable, is it duplicated, and does it sit on the right side of a module boundary?
    signature: >-
      Dead code kept because deleting it felt risky, a second copy of a rule that must agree with
      the first, or a layering violation that makes the next change cost more.
    precedent: >-
      2,351 units, and the operator's note that this is the seat most often folded into others --
      which is the argument for giving it one of its own.
    measurement: >-
      Dead symbols and duplication are countable and Dream Studio's leanness gate already reports
      them; the judgement is which findings are worth acting on, which the gate deliberately
      leaves advisory.
    standards:
      - "PEP 8"
      - "PEP 484 type hints"
      - "CWE-561 dead code"
    judgment: true
    why: >-
      The leanness gate already measures this and is advisory on purpose, because the count is
      large and the severity is contextual. This lane exists so the advisory output has a seat
      that owns triaging it.
