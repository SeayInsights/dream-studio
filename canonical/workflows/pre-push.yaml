name: pre-push
description: >
  Pre-push gates that block `git push` on regressions in formatting, lint
  baseline, source-skill integrity, evals, and contract atlas leakage.
  Advisory gates surface hygiene signals without blocking push.
  Invoked by hooks/git/pre-push.
version: 2
on_failure: stop

# Gate tiers (AD-3 two-tier model):
#   tier: blocking  — gate failure blocks push (default)
#   tier: advisory  — gate failure surfaces a warning but does not block push
#
# Classification rule: correctness / safety / authority-integrity → blocking
#                      hygiene / drift / informational              → advisory
#
# Each gate is run via subprocess by core/gates/pre_push.py.
# Exit code 0 = pass, non-zero = fail. cwd is the repo root.
# Order matters — cheapest gates first so a failure halts the slow ones.
gates:
  - id: lane-review
    tier: blocking
    description: >
      The branch's work order is not pushed while its lane review holds it -- no
      dispatch, an unanswered lane, or an open finding. The review lanes run before
      anything reaches GitHub; the pushed-status gate governs a status, and this is
      where an actual `git push` stops. A branch naming no work order is reported
      NOT GATED rather than passed.
    command: [py, -m, interfaces.cli.lane_review_gate]
    fail_hint: "Run `ds review --status --work-order <id>`; answer the open findings, re-dispatch, record."

  - id: format-check
    tier: blocking
    description: >
      `py -m black --check .` must report zero would-reformat files. Prevents
      the recurring formatting-CI failure that broke PRs #23-#27.
    command: [py, -m, black, --check, .]
    fail_hint: "Run `py -m black .` to fix formatting, then re-push."

  - id: lint-check
    tier: blocking
    description: >
      The flake8 baseline must show status=pass with no new findings beyond the
      pinned baseline file.
    command: [py, interfaces/cli/lint_baseline.py, check]
    fail_hint: "Fix new lint findings; do not bypass the baseline."

  - id: docs-drift
    tier: blocking
    description: >
      Contract docs drift gate. Detects when a changed contract domain's
      required docs were not refreshed alongside it. Runs here AND in CI's
      pr-smoke (Contract docs drift step) -- #752 gave it CI as its one home,
      reasoning the two blocking copies were redundant since CI always catches
      it; the accepted cost was that drift then surfaces from a 3-platform CI
      round trip instead of your own push. That cost proved too high: a push
      passed every local gate and went red on all three CI platforms on this
      exact drift the same week. Uses DREAM_STUDIO_BASE_REF=origin/main, the
      same base CI resolves to (origin/<base-branch>, defaulting to main), so
      both lanes diff the same branch point and honor the same
      Docs-Reviewed-No-Change trailer (see interfaces/cli/_gate_review_context.py)
      -- local-green now means CI-green for this gate again. env also pins
      DREAM_STUDIO_CHANGED_FILES empty: the gate script honors that var as an
      override that bypasses git-based diffing entirely (a documented, real
      escape hatch -- see the gate's own --help), and CI only ever ran this
      script in a clean Actions runner where a stray export could not exist.
      Pre-push runs it in a developer's own shell, where it could -- pinning
      it here means a value left set for something unrelated cannot silently
      replace this gate's detection on every push made from that shell.
    command: [py, interfaces/cli/contract_docs_drift_gate.py]
    env:
      DREAM_STUDIO_BASE_REF: origin/main
      DREAM_STUDIO_CHANGED_FILES: ""
    fail_hint: >
      A changed contract domain's required docs were not refreshed -- see the
      "contract docs drift: FAIL" lines the gate prints to stderr for which
      domain and which docs (the same detail is in the stdout JSON under
      blocking_domains[]). Refresh those docs in this change set, or add an
      accurate `Docs-Reviewed-No-Change: <domain_id>` commit trailer if the
      domain genuinely needs no doc change.

  - id: skill-sync
    tier: blocking
    description: >
      Source-level enforcement-block regression check (A4/A5 invariant) — the
      `_ENFORCEMENT_BLOCK` constant must contain zero `py -m interfaces.cli.ds`
      references.
    command: [py, -m, core.gates.skill_sync_source]
    fail_hint: >
      The compiler enforcement block has regressed back to CLI references.
      Restore the function-call form per A4/A5.

  - id: skill-card
    tier: blocking
    description: >
      A changed mode card validates against schemas/skill_card.schema.json, reports the
      coordinates it actually sits at, and consumes only vocabulary some mode produces or
      canonical/skill_vocabulary.json registers. The nine-field block was uniform across all
      51 carded modes by convention with nothing reading it, and the first run found 12 cards
      still describing themselves as domains modes after the website and fullstack sub-packs
      were split out - stale in the field the routing table is generated from. Adds
      write_posture (capabilities say what a mode can reach, not what it may do unattended)
      and lifecycle (packs.yaml had no way to mark a mode superseded short of deleting it and
      breaking every invocation that names it). Diff-scoped: 34 of 85 declared modes carry no
      card yet, so whole-tree would be a wall; those drain as they are touched.
    command: [py, -m, core.gates.skill_card]
    fail_hint: >
      A changed mode card is invalid, misreports its pack/mode, or consumes a token nothing
      produces. Fix the card, or register a genuinely external input with
      `py -m core.gates.skill_card --update`. Audit everything with --all.

  - id: test-suite
    tier: blocking
    description: >
      Targeted eval suite (tests/evals/) must pass. Scoped to evals (not the
      full test suite) to stay OOM-safe per the established testing policy.
    command: [py, -m, pytest, tests/evals, -q]
    fail_hint: "Eval failures block push — fix the failing eval before retry."

  - id: pin-tests
    tier: blocking
    description: >
      Exact-set schema/contract pin tests the pr-smoke matrix does not run.
      Two post-merge full-ci reds in one day came from this class (packs.yaml
      handler list + plugin.json after #442; the DuckDB schema pin after #450).
      A pin only drifts when a change set adds an object without updating the
      expected set — precisely a pre-push-time mistake. Fast and deterministic.
    command: [py, -m, pytest,
      tests/unit/test_duckdb_business_schema.py,
      tests/unit/test_packs_yaml_integrity.py,
      tests/unit/test_plugin_manifest.py,
      tests/unit/test_schema_debt_doc.py,
      tests/unit/test_hook_runtime_reliability.py,
      tests/unit/test_schema_tombstones.py,
      tests/unit/test_module_registry_contract.py,
      tests/unit/test_contract_atlas.py,
      tests/unit/test_state_contract_boundaries.py,
      tests/unit/test_plugin_dist.py,
      tests/unit/test_skill_module_paths_resolve.py,
      tests/unit/test_ds_update_skill_drift.py,
      tests/unit/test_work_order_boundary_is_declarable.py,
      tests/unit/test_fail_open_probe_gate.py,
      tests/unit/test_test_isolation_gate.py,
      tests/unit/test_fixture_schema_parity_gate.py,
      tests/unit/test_seam_payload_to_projection.py,
      tests/unit/test_task_status_vocabulary.py,
      tests/unit/test_grader_retry_policy.py,
      tests/unit/test_review_failure_names_its_objection.py,
      tests/unit/test_check_records_its_runner.py,
      tests/unit/test_skip_verify_reaches_the_post_gate.py,
      tests/unit/test_originating_symptom_is_executable.py,
      tests/unit/test_milestone_status_vocabulary.py,
      tests/unit/test_update_clears_its_own_drift.py,
      tests/unit/test_unexecuted_checks_are_declared.py,
      tests/unit/test_attachment_pressure_is_relievable.py,
      tests/unit/test_graded_range_includes_own_commits.py,
      tests/unit/test_citation_registry.py,
      tests/unit/test_gate_manifests_name_real_files.py,
      tests/unit/test_generated_artifacts_gate.py,
      -q]
    fail_hint: >
      A schema/contract pin drifted — update the pin's expected set in the SAME
      change set as the schema/artifact change (DuckDB objects in
      test_duckdb_business_schema.py, packs.yaml handler lists, regenerated
      plugin.json, a schema-debt doc entry for new migrations).

  - id: rule-enforcement
    tier: blocking
    description: |
      Every enforced_by reference in canonical/rules.yml must resolve, or the rule must
      declare itself unenforced with a reason. The register exists to separate the
      statements something enforces from the ones nothing does; its previous checker
      (core/gates/rule_registry.py) was culled in the same sweep that removed several of
      the enforcers it would have been checking, and 21 of 102 references went stale.
    command: [py, -m, core.gates.rule_enforcement]
    fail_hint: "A rule names an enforcer that is not there. Point it at the one that survived, or add `unenforced: <20+ characters saying what is gone and why>` and remove its enforced_by."

  - id: agent-coverage
    tier: blocking
    description: |
      Every skill mode either names the specialist compiled from it or says in writing why
      it has none. Enforce-or-declare: a gap nobody wrote down is indistinguishable from a
      choice nobody made. Measured when this landed: 85 modes, 9 agents, and the eleven
      audit modes beside quality/accessibility -- which had one -- had none.
    command: [py, -m, core.gates.agent_coverage]
    fail_hint: "A mode is neither answered by a specialist nor accounted for. Add an `agent:` row to canonical/agents/coverage.yml and recompile, or add `no_agent: <20+ characters saying why>`."

  - id: instruction-commands
    tier: blocking
    description: |
      Every script path and first-party module a canonical skill or workflow tells an
      agent to RUN must exist. An agent does what an instruction says; a command that
      cannot run is a step silently skipped, and the steps instructions name are
      disproportionately checks.
    command: [py, -m, core.gates.instruction_commands]
    fail_hint: "A canonical instruction names a command that cannot run. Write the thing, correct the path, or remove the instruction."

  - id: generated-artifacts
    tier: blocking
    description: >
      Every checked-in artifact that has a generator must match what the
      generator emits. An edit to a generated file is not a change -- it is one
      the next render silently discards, and until then the artifact and its
      generator disagree about what is true. Commit 3b2dc373 removed four lanes
      from the GENERATED canonical/review_lanes.yml without touching
      scripts/seat_lanes_data.py; a render three weeks later restored exactly
      those 115 lines, and 1,665 lines of detectors were rewritten against them
      before the history showed the deletion was deliberate. AGENTS.md had a
      working freshness check the whole time that was wired into nothing.
    command: [py, -m, core.gates.generated_artifacts]
    fail_hint: >
      Re-run the named generator and commit its output -- then make your change
      in the GENERATOR, not the artifact. `--list-unverifiable` shows the files
      that claim generation while naming no runnable command; those do not fail
      this gate and are worth fixing one at a time.

  - id: review-lane-registry
    tier: blocking
    description: >
      Every review lane must carry enforcement that actually exists: a detector
      whose module imports and has a callable main(), a graded eval, or an
      explicit `judgment: true` with a reason. This gate was written, was
      correct, and was wired into nothing — so four lanes shipped naming
      detectors that were ModuleNotFoundError, and the registry read as
      mechanically enforced while a third of its detector lanes enforced
      nothing. Not absent verification; disconnected verification. It imports
      rather than spawns, so it costs milliseconds, not a subprocess per lane.
    command: [py, -m, core.gates.review_lane_registry]
    fail_hint: >
      A lane declares enforcement it does not have. Write the detector, point
      the lane at a real eval file, or declare `judgment: true` with a `why`
      naming what is missing — a lane wearing the costume of a detector is
      worse than one that says it is a question.

  - id: review-lanes-drift
    tier: advisory
    description: >
      canonical/review_lanes.yml is generated from scripts/seat_lanes_data.py.
      This check existed and ran nowhere, so the two diverged by 115 lines —
      and those lines were hiding the four lanes with missing detectors above.
      Drift in a generated artifact is advisory per the tier rule, but this
      drift is how the blocking failure stayed invisible.
    command: [py, scripts/seat_lanes_data.py, --check]
    fail_hint: >
      Re-run `py scripts/seat_lanes_data.py` and commit the result. Edit the
      generator, never the generated file — a hand-edit is undone by the next
      render, silently.

  - id: unit-collect
    tier: blocking
    description: >
      Full tests/unit collection smoke (--collect-only). Catches import-time
      errors the pr-smoke subset never sees — e.g. a test that read a migration
      file the squash deleted (the #462 post-merge red: 7 phase-19x files errored
      at collection). Cheap (seconds); no test bodies run.
    command: [py, -m, pytest, tests/unit, --collect-only, -q]
    fail_hint: >
      A test file errors at import/collection — usually a path to a deleted file
      or a renamed symbol. Fix the import; do not skip. This mirrors what the
      full-CI unit run does before it can even start.

  - id: locale-decode
    tier: blocking
    description: >
      A subprocess call with text=True and no encoding= decodes the child's
      output with the platform locale codec — cp1252 on Windows. Every gate
      here emits UTF-8, so one unmapped byte (a cross mark or a left arrow is
      enough) kills subprocess's reader thread; run() then returns
      returncode=0 with stdout=None and the caller is handed success plus no
      output (WO-LOCALE-DECODE-SILENT-LOSS). 62 product sites across eleven
      gate files had accumulated, because nothing checked. AST-based, so
      text=True in a string or a multi-line call is judged correctly.
    command: [py, -m, core.gates.locale_decode_gate]
    fail_hint: >
      Add encoding="utf-8", errors="replace" to the named subprocess call. If the
      call is deliberately unguarded (only the gate's own test should be), mark
      its line `# locale-decode-gate: intentional — <why>`; the gate prints every
      exemption, so it stays visible.

  - id: migration-risk
    tier: blocking
    description: >
      Migration risk classifier. Detects SQL/migration-file changes and
      requires explicit matrix-watch confirmation before merge. Migration
      changes have historically passed local tests but failed on macOS/Windows
      in the remote 3-platform matrix. Skip with
      MIGRATION_RISK_ACKNOWLEDGED=1 git push after confirming matrix is running.
    command: [py, -m, core.gates.migration_risk]
    fail_hint: >
      SQL/migration files changed. Run `gh pr checks <N> --watch` and confirm
      all three platforms (ubuntu, macos, windows) are green before merging.
      To bypass: MIGRATION_RISK_ACKNOWLEDGED=1 git push

  - id: rule1-adapters-no-authority
    tier: blocking
    description: >
      Dependency rule 1: runtime/hooks/ must not write directly to authority tables
      (business_*, raw_*, reg_*, canonical_events). Hooks must emit events via spool
      only. Any direct SQL write from the adapter layer is a boundary violation.
    command: [py, -m, core.gates.dependency_rules, rule1]
    fail_hint: "Rule 1 violation — runtime/hooks/ wrote to an authority table. Route through spool/emitters instead."

  - id: rule2-projections-readonly
    tier: blocking
    description: >
      Dependency rule 2: projections/ modules must be read-only. No INSERT, UPDATE,
      or DELETE against canonical authority tables (business_*, raw_*, reg_*,
      canonical_events) from projections/api/ or projections/core/ (tests excluded).
    command: [py, -m, core.gates.dependency_rules, rule2]
    fail_hint: "Rule 2 violation — a projection module wrote to an authority table. Move the write to the CLI or ingestor layer."

  - id: rule3-cli-business-state-writer
    tier: advisory
    description: >
      Dependency rule 3 (advisory): API route handlers in projections/api/routes/
      must not write directly to business_* tables. The CLI/work-order layer is the
      designated writer for business state. Warning tier only until false-positive rate
      is confirmed low.
    command: [py, -m, core.gates.dependency_rules, rule3]
    warn_hint: "Rule 3 advisory — a route handler wrote to business_* directly. Consider routing through the CLI/work-order layer."

  - id: security-scan
    tier: blocking
    description: >
      A changed file may not introduce a security anti-pattern. A live shell
      injection sat in the workflow runner for a month while DS's own
      shell=True detector reported clean on that exact file: its pattern
      required the token and the keyword on ONE line, and black formats any
      multi-argument call across lines, so it was blind to 189 of 245
      subprocess call sites. Detection now PARSES rather than pattern-matches,
      which also stops it flagging its own prose -- the eval() pattern matched
      10 files and a parse confirmed a real eval() call in none of them. This
      is the BLOCKING tier: the on-security-scan hook is PostToolUse, so the
      edit has already happened, and a file written by a patch script, a merge
      or a rebase fires no Edit/Write hook at all. Diff-scoped, and the tracked
      tree currently has zero findings.
    command: [py, -m, core.gates.security_scan]

  - id: fail-open-probe
    tier: blocking
    description: >
      Inside a function whose own handler returns a permissive constant, every
      database call must carry its own handler. Otherwise an optional probe that
      cannot run answers the whole question: authority_write_since reported "an
      authority write happened" for every work order on the machine when one of
      its five probes hit a column an older schema lacked, silently disabling
      stop enforcement while claiming success.
    command: [py, -m, core.gates.fail_open_probe]
    fail_hint: >
      Wrap the named database call in its own try/except so a probe that cannot
      run contributes nothing instead of answering for its siblings. If that new
      guard swallows the error silently (no log, no re-raise), fail-open-census
      may flag it on the very next push -- that is not the tooling contradicting
      itself, it is a second, broader question (does ANY handler let an error
      pass silently) catching a new instance of its own class; log the failure
      or regenerate that gate's baseline once you've reviewed it.

  - id: fail-open-census
    tier: blocking
    description: >
      Ratcheted census (H30) of the broader fail-open shape fail-open-probe does
      not cover: a bare `except: pass`, or an except handler whose last statement
      returns a falsy sentinel (None, bare return, False, 0, "", [], {}, ()). 831
      existing sites are pinned as tracked debt in
      runtime/config/release-gates/fail-open-baseline.txt; this gate fails only
      on a NEW site beyond that baseline, the same ratchet lint-baseline.py
      already uses for flake8. Most existing sites are legitimate (a missing
      optional file IS legitimately "return None") — the ratchet exists so the
      count cannot silently grow, not to demand every one be rewritten today.
    command: [py, -m, core.gates.fail_open_census]
    fail_hint: >
      A new bare `except: pass` or falsy-return handler was added in product
      code. Log it, re-raise it, or return a signal the caller can act on. If
      it is deliberate and reviewed, regenerate the baseline:
      py -m core.gates.fail_open_census --write-baseline

  - id: test-isolation
    tier: blocking
    description: >
      A test may not monkeypatch.setattr an inline fake over a stdlib type's
      instance method. Such a replacement answers identically for every object in
      the process and stays installed through teardown, where autouse guards run —
      the shape that made the spool guard see writes into the operator's real
      ~/.dream-studio and abort the suite FATAL while the test itself passed.
    command: [py, -m, core.gates.test_isolation]
    fail_hint: >
      Replace the lambda/mock with a named function that delegates to the real
      implementation for anything but the object under test.

  - id: fixture-schema-parity
    tier: blocking
    description: >
      A test fixture may not give an authority table a column a fresh database
      does not have. A test asserting on a column production never writes cannot
      fail for the right reason. Omitting columns stays legal; inventing them does
      not. The authority is a freshly bootstrapped database, not a parse.
    command: [py, -m, core.gates.fixture_schema_parity]
    fail_hint: >
      Use the real column name, or — if the drift IS the subject under test —
      declare `# fixture-schema-parity: allow <table>.<column> -- <reason>` with a
      reason of at least 20 characters.

  - id: rule4-ingestor-sole-event-writer
    tier: blocking
    description: >
      Dependency rule 4: no module outside the ingestor path may INSERT INTO
      canonical_events (the compat VIEW alias). The ingestor writes to
      business_canonical_events and ai_canonical_events directly. Any direct
      INSERT to the canonical_events VIEW name is an authority boundary violation.
    command: [py, -m, core.gates.dependency_rules, rule4]
    fail_hint: "Rule 4 violation — INSERT INTO canonical_events found outside spool/ingestor.py. Use the spool/emitter path instead."

