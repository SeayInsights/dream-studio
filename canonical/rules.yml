# Dream Studio rule registry.
#
# WHY THIS FILE EXISTS. Operator, on the substrate: it is "a lot of prose laid on top of
# each other as suggestions with no rules, evals, or really any real test that doing
# anything they are supposed to". Nothing distinguished the statements something enforces
# from the ones nothing does.
#
# THE SIZE OF THE PROBLEM, corrected 2026-09-07. This header previously recorded "2,172
# normative statements" as though it were a backlog of unwritten rules. It is not: it was a
# count of WORD OCCURRENCES under one pattern, and most occurrences are ordinary English
# inside explanatory prose -- "the runner must be the sole writer" in a docstring describing
# a design is not an unenforced rule. Re-measured across the same corpus:
#
#   SHOUTED (MUST / MUST NOT / NEVER / ALWAYS / REQUIRED / DO NOT / SHALL / MAY NOT):  191
#   any-case (must / never / always / required / should not / do not / shall):        5,752
#
# Neither is a rule backlog, and 5,752 rules would be absurd. The tractable candidate set is
# the shouted form, because writing a rule in capitals is a deliberate act. That count is now
# a CEILING per lane in canonical/normative_baseline.json, enforced by the blocking
# normative-baseline gate: it may only go down. Leaving the inflated figure in place would
# have been the same defect this file exists to fix -- an unfalsified claim in prose.
#
# THE LANE MATTERS, because the enforcement substrate differs by kind. A constraint on the
# CODE becomes a gate. An instruction to a MODEL at runtime ("ask one question at a time")
# can only become an EVAL -- no static check settles it, and canonical/skills holds the
# largest genuinely unenforced share. A DESCRIPTION of the machine should be generated from
# the machine or deleted, never restated as a rule; AGENTS.md is already generated from
# packs.yaml, and a hand-written second copy of behaviour is what rots.
#
# The proof that this matters is `Module boundary:`. It was a load-bearing rule -- edit
# attribution matched against it -- stated in prose, read by a regex, and supplied by no
# authoring door: `create_work_order` accepted --description and DROPPED it, so 0 of 25
# in-progress work orders could declare a boundary and every edit in a project was
# attributed to whichever work order started last. The operator had to bypass enforcement
# to end a session, repeatedly, for months.
#
# THE CONTRACT. Every entry is one normative statement. It carries EITHER:
#   enforced_by: a check that fails when the rule is broken (pytest node id or gate module)
#   guidance:    true, with `why`, when the statement is judgment no check can settle
# An entry with neither is refused by the gate. So is an `enforced_by` naming a check that
# does not exist or collects nothing -- an unrunnable check is the same as no check, and
# that exact rot was found on eight acceptance criteria this session.
#
# This registry starts small on purpose. Seeding it with hundreds of half-classified entries
# would reproduce the problem in YAML. It grows by ratchet, not by sweep: the
# normative-baseline gate refuses any change set that raises a lane's ceiling, so a new
# shouted statement must be classified here, converted to an eval, generated from what it
# describes, or deleted -- in the same change set. The backlog drains as a side effect of
# ordinary work instead of needing a heroic pass nobody finishes.

version: 1

rules:
  - id: work-order-declares-module-boundary
    statement: >
      Every work order must declare the paths it owns, so an edit is attributed by a
      declared boundary rather than by which work order started most recently.
    source: canonical/skills/ds-workorder/SKILL.md
    enforced_by:
      - tests/unit/test_work_order_boundary_is_declarable.py::test_the_create_door_requires_a_boundary
      - tests/unit/test_work_order_boundary_is_declarable.py::test_a_composed_boundary_round_trips_through_the_real_parser
    note: >
      Enforced at the authoring door: --module-boundary is required, and the clause is
      composed by the machine into the form the parser reads rather than remembered by an
      author. Before this the rule was unsupplyable, not merely unenforced.

  - id: work-order-description-is-persisted
    statement: >
      A description supplied to the authoring door must be stored, not silently discarded.
    source: core/work_orders/mutations.py
    enforced_by:
      - tests/unit/test_seam_payload_to_projection.py::test_description_specifically_survives_the_round_trip
    note: >
      Measured 2026-09-04: 443 of 920 work orders had an empty description, and 18 of the
      19 created since 2026-09-01. The emitter omitted description from the event payload
      and the projection never read it, so everything an author typed was accepted and
      dropped -- including the boundary clause the rule above depends on.

  - id: enforcement-blocks-only-on-evidence
    statement: >
      The stop hook must demand an authority write only when a declared module boundary
      proves the work order owns the edit. Attribution by recency, or with no recorded
      basis, must record an observation and allow the stop.
    source: runtime/hooks/meta/on-stop-enforce.py
    enforced_by:
      - tests/unit/test_stop_hook_remedy_is_achievable.py::test_the_emitted_violation_never_prescribes_an_impossible_command
    note: >
      Operator: "it continuously happens when i switch projects and i have to bypass it."
      Blocking on absent evidence trains the operator to bypass, which costs enforcement
      its authority on the cases that are real.

  - id: enforcement-remedy-is-achievable
    statement: >
      A blocking message must never prescribe a command the operator cannot run.
    source: runtime/hooks/meta/on-stop-enforce.py
    enforced_by:
      - tests/unit/test_stop_hook_remedy_is_achievable.py::test_remedy_is_achievable_when_no_task_remains
      - tests/unit/test_stop_hook_remedy_is_achievable.py::test_the_multi_claimant_message_is_also_achievable
      - tests/unit/test_stop_hook_remedy_is_achievable.py::test_the_docstore_remedy_is_not_prescribed_for_a_missing_file
    note: >
      Found four times in one session, each in a different branch of the same file. A gate
      whose remedy cannot be performed drives the operator to the two outcomes it exists
      to prevent: a false record, or a bypass.

  - id: shipped-skill-paths-resolve
    statement: >
      A path a skill tells an agent to open must exist in the tree the agent stands in.
    source: canonical/skills
    enforced_by:
      - tests/unit/test_skill_module_paths_resolve.py::test_no_shipped_skill_points_at_a_file_no_install_has
    note: >
      Operator report: an install "couldn't do the reviews because it didn't have some of
      the files needed". 111 references across 3 packs resolved nowhere, because projection
      renames the pack directory and the references were written canonical-relative.

  - id: skill-change-reaches-installs
    statement: >
      A canonical skill change must reach an existing install even without a version bump.
    source: interfaces/cli/commands/system_health.py
    enforced_by:
      - tests/unit/test_ds_update_skill_drift.py::test_gate_consults_skills_a_skill_edit_is_drift
      - tests/unit/test_ds_update_skill_drift.py::test_a_deleted_installed_file_is_drift
      - tests/unit/test_ds_update_skill_drift.py::test_a_library_only_edit_is_drift
    note: >
      The version gate consulted hook drift only, so a skill change printed
      already_current and installed nothing -- and the drift check could not see a file
      that had been deleted, which is the reported symptom itself. The SHARED HOOK LIBRARY
      was invisible for the same reason one directory over: the index required "meta" in
      the path and the walk covered runtime/hooks/meta only, so runtime/lib/enforcement.py
      -- every enforcement decision the hooks make -- was excluded from both. Measured
      2026-09-07, the user-scope projection of that library was stale AND firing while
      ds update reported one drifted file, a meta handler that happened to change in the
      same session; had only the library changed it would have reported none.

  - id: no-fabricated-data
    statement: >
      Never present fabricated data, counts, or results as measured.
    source: CLAUDE.md
    enforced_by:
      - core.gates.evidence_backed_output
      - tests/unit/test_evidence_backed_output.py::test_an_unbacked_claim_is_flagged
      - tests/unit/test_evidence_backed_output.py::test_the_real_unbacked_claims_from_this_session_are_caught
    residual_risk: >
      The gate proves a claim CITES something checkable -- a command with its output, a
      test count with its unit, a file.py:line, a commit sha, a run id, a named artifact.
      It cannot prove the cited thing was actually run, or that the number came from it, so
      a fabricated figure presented beside a real-looking citation still passes. Closing
      this needs the cited command re-executed at claim time, the way an
      originating-symptom SQL check is re-run at close. Filed as PARTIAL rather than
      guidance because the citation requirement is real enforcement, and calling the whole
      rule unenforceable understated what the substrate already does.

  - id: tests-run-by-a-different-agent
    statement: >
      Tests and evals are always run by a different agent than the one that authored them.
    source: canonical/skills/core/modes/review/SKILL.md
    enforced_by:
      - tests/unit/test_check_records_its_runner.py::test_every_check_result_carries_a_runner
      - tests/unit/test_check_records_its_runner.py::test_an_absent_session_is_recorded_as_unknown_not_omitted
    residual_risk: >
      Every check result now records WHO ran it (session, adapter, host, pid), so an
      author-run suite is no longer indistinguishable from an independent runner's report
      in the stored artifact. Nothing yet COMPARES that runner against the author, because
      the authority records no author for a task -- mark_task_done emits task.completed
      with session_id=None. So the substrate can say who ran a check and cannot yet say it
      was someone else. Closing this needs author identity on authority writes, tracked as
      WO fb7375d9. The previous claim that no check inside the repo could observe this was
      wrong in its reason: it could not be observed because the identity was never written
      down, not because observing it is impossible.

  - id: grader-retries-until-one-clean-verdict
    statement: >
      A grader miss is retried up to 20 times looking for one clean verdict, and a timeout
      keeps its full collect budget rather than being handed less time than already expired.
    source: core/work_orders/verify_graders.py
    enforced_by:
      - tests/unit/test_grader_retry_policy.py::test_a_transient_miss_is_retried_until_a_clean_verdict
      - tests/unit/test_grader_retry_policy.py::test_a_timeout_keeps_the_full_collect_budget
      - tests/unit/test_grader_retry_policy.py::test_the_parallel_path_shares_the_policy
    note: >
      Four timeouts to one success in a single session, each leaving a work order
      uncloseable. There was one retry, and it was given the SHORT budget after the long
      one expired -- so the single recovery attempt was near-certain to fail too. The
      attempt count is bounded by a wall-clock ceiling as well: 20 attempts at a 360s
      collect window is two hours on ONE role and a work order runs several, so a single
      degraded provider could stall a close for most of a day while reporting nothing.
      Both ceilings live in one helper both retry paths call, and whichever is reached
      first is recorded on the result as grader_retry_stopped_by. An exhausted provider
      quota is not retried at all: a re-spawn cannot conjure capacity any more than it can
      conjure a missing binary, and unlike a missing binary it arrives looking like an
      ordinary non-JSON reply -- five work orders in one sweep spent attempts on "You've
      hit your session limit - resets 5pm" before this was recognised.

  - id: recoverable-bookkeeping-is-not-escalated
    statement: >
      The system interrupts a human for decisions, never for bookkeeping it can redo
      itself. A stale review verdict is re-verified automatically; a failing review still
      blocks the close.
    source: core/work_orders/close_main.py
    enforced_by:
      - tests/unit/test_close_self_heals_stale_verdict.py::test_a_failing_review_is_not_healed_into_a_pass
      - tests/unit/test_close_self_heals_stale_verdict.py::test_only_staleness_triggers_the_re_verify
      - tests/unit/test_close_self_heals_stale_verdict.py::test_a_failed_re_verify_does_not_mask_the_gate
    note: >
      Staleness is the normal state of a work order whose own fixes are still landing.
      Three closes in one session blocked on nothing else, each telling the operator to
      run a command the system could run itself, and one went stale again during the
      manual re-run.

  - id: a-patch-target-is-a-real-dependency
    statement: >
      A mock.patch target names a real dependency even though it is written as a string,
      so comment-and-string de-noising must not erase it.
    source: core/gates/hanging_detectors.py
    enforced_by:
      - tests/integration/test_session_regressions.py::test_347_353_354_would_have_been_blocked
    note: >
      _code_only blanked string contents to stop prose raising false positives and
      silently removed exactly the reference the changed-signature detector exists to
      find. The comment above it still claimed patch targets were caught.

  - id: an-optional-probe-may-not-answer-for-all
    statement: >
      Inside a function whose own handler returns a permissive constant, every database
      call carries its own handler, so a probe that cannot run contributes nothing instead
      of answering the whole question.
    source: runtime/lib/enforcement.py
    enforced_by:
      - core.gates.fail_open_probe
      - tests/unit/test_fail_open_probe_gate.py::test_catches_the_historical_defect
      - tests/unit/test_fail_open_probe_gate.py::test_gate_is_bound_to_the_real_enforcement_module
    note: >
      authority_write_since consults five independent signals under one fail-open handler.
      A probe selecting created_at from an older business_tasks raised, the function-level
      handler turned that into `return True`, and stop enforcement was silently disabled
      while reporting the condition SATISFIED for every work order on the machine. Two of
      the five probes were guarded; three were not, and the difference was invisible until
      a full-suite run. The five now route through one probe() helper, so a sixth gets the
      isolation without anyone knowing this history.

  - id: a-test-may-not-fake-a-stdlib-method-process-wide
    statement: >
      A test may not install an inline fake (lambda, mock, or constant) over a stdlib
      type's instance method with monkeypatch.setattr; the replacement must be a named
      function that delegates to the real implementation for anything but the subject.
    source: tests/unit/test_game_validate.py
    enforced_by:
      - core.gates.test_isolation
      - tests/unit/test_test_isolation_gate.py::test_catches_the_patch_that_aborted_the_suite
      - tests/unit/test_test_isolation_gate.py::test_gate_is_bound_to_the_real_suite
    note: >
      `monkeypatch.setattr(type(f), "stat", lambda self_, **_: mock_stat)` made every path
      in the process report 20 MB until fixture teardown -- where the autouse spool guard
      concluded the run had written into the operator's real ~/.dream-studio/events and
      aborted FATAL. The test passed throughout; the damage was entirely to its
      neighbours, and the full local suite could not complete. That is why 45 failures
      reached main on a green subset. Path.home stays deliberately exempt: it is the
      mechanism that keeps ~100 tests off live state.

  - id: a-fixture-may-not-invent-a-column
    statement: >
      A test fixture may not give an authority table a column a fresh database does not
      have. Omitting columns is fine; inventing them is not.
    source: core/config/sqlite_bootstrap.py
    enforced_by:
      - core.gates.fixture_schema_parity
      - tests/unit/test_fixture_schema_parity_gate.py::test_invented_column_fails
      - tests/unit/test_fixture_schema_parity_gate.py::test_exemption_without_a_real_reason_is_itself_a_finding
    note: >
      Six fixtures described tables production does not have -- business_projects.id for
      project_id, validation_results.result_id for validation_id, scan_runs.run_id for
      scan_id, raw_sessions.exit_reason for nothing at all, and a project_id on
      ai_canonical_events that made the DuckDB fact test exercise the column-present
      branch AI events never take. The authority is a freshly bootstrapped database read
      back out of sqlite_master, not a parse of the baseline: a gate that duplicates the
      schema it checks eventually checks its own copy.

  - id: a-payload-key-must-reach-its-projection
    statement: >
      Every key an emitter puts in an event payload must be persisted by the projection
      that consumes it, or be declared unpersisted with the reason storing it would be
      wrong.
    source: core/projections/work_order_projection.py
    enforced_by:
      - tests/unit/test_seam_payload_to_projection.py::test_the_emitter_and_the_projection_agree_on_every_payload_key
      - tests/unit/test_seam_payload_to_projection.py::test_the_stored_description_is_readable_by_the_real_boundary_parser
      - tests/unit/test_seam_payload_to_projection.py::test_declared_exceptions_are_still_sent_by_the_emitter
    note: >
      Nothing connected the emitter to the projection. create_work_order did not carry
      description and the projection did not read it, so 443 of 920 work orders on the
      live authority had none -- and the Module boundary: clause that edit attribution
      matches against could not be declared at all. The first version of this check
      asserted on SOURCE TEXT, which proves a string is present rather than that a value
      survives. The payload key set is now derived from the emitter by parsing it and the
      row is produced by the real projection against a real bootstrapped schema, so a key
      added to the emitter fails here without anyone remembering this file exists.

  - id: the-unclassified-pile-may-only-shrink
    statement: >
      A change set may not raise any lane's count of shouted normative statements. A new one
      must be classified here with a runnable check, converted to an eval, generated from
      what it describes, or deleted.
    source: canonical/normative_baseline.json
    enforced_by:
      - core.gates.normative_baseline
      - tests/unit/test_normative_baseline_gate.py::test_an_increase_fails_and_names_the_four_ways_out
      - tests/unit/test_normative_baseline_gate.py::test_a_decrease_also_fails_so_the_ceiling_cannot_drift
      - tests/unit/test_normative_baseline_gate.py::test_counts_only_the_shouted_form
    note: >
      This registry answers the operator's complaint one rule at a time and cannot answer it
      at scale: hand-classifying drifts, and nothing stopped the pile regrowing the next day.
      The ratchet is the scaling mechanism, modelled on the flake8 lint_baseline this repo
      already runs. A DECREASE fails too, which is the half that makes it monotonic -- a
      ceiling left above reality floats upward silently and stops meaning anything. The gate
      counts only the SHOUTED form: the any-case count is 5,752 against 191 shouted, and an
      unmeetable ceiling gets switched off, which is worse than having none.

  - id: a-decided-question-has-one-supported-read
    statement: >
      When a function answers a question directly, that function is the only supported read.
      The raw fields it interprets may be touched only where they are produced.
    source: core/work_orders/close_main.py
    enforced_by:
      - core.gates.single_read_path
      - tests/unit/test_single_read_path_gate.py::test_catches_a_caller_that_rederives_close_readiness
      - tests/unit/test_single_read_path_gate.py::test_a_missing_gates_pass_key_is_not_an_optimistic_pass
      - tests/unit/test_single_read_path_gate.py::test_closability_reasons_are_empty_exactly_when_it_can_close
    note: >
      A survey asked whether thirteen work orders could close, read result["gates"] instead
      of gates_pass/gate_failures, got None, and reported all thirteen CLOSABLE while every
      one was blocked on independent_review. The operator was told work was ready to close,
      more than once, and it was not. The shape was documented correctly the whole time, so
      no doc fix prevents this: answering a yes/no question through a dict lookup makes the
      permissive answer the default outcome of any mistake. closability() returns a tuple,
      which cannot be mis-keyed, and resolves every ambiguity toward NOT closable.

  - id: a-vocabulary-has-one-definition
    statement: >
      A status vocabulary is defined once and imported. Where a standalone boundary forces a
      second copy, a parity test holds the copies in agreement.
    source: core/work_orders/task_status.py
    enforced_by:
      - core.gates.single_read_path
      - tests/unit/test_task_status_vocabulary.py::test_the_hook_copy_agrees_with_the_definition
      - tests/unit/test_task_status_vocabulary.py::test_completed_is_not_in_the_vocabulary
      - tests/unit/test_task_status_vocabulary.py::test_the_hook_library_takes_no_module_level_repo_import
    note: >
      business_tasks.status holds 'complete' (2,229 rows) and 'done' (27). mark_task_done
      counted remaining work against a literal that omitted 'done', so a finished task
      counted as still remaining in the number feeding the tasks_done gate -- ten work
      orders held one, all already closed, so nothing was blocked today and the next one
      would have been. A diagnostic hardcoded ('done', 'completed') and reported every work
      order 0-done, because 'completed' is not a value this column holds; it is the trap,
      because it reads correctly and IS correct in other tables. The hook library keeps its
      own copy because it must import cleanly where the repo is not importable, so the
      copies are held together by a parity test that also asserts that justification still
      holds.

  - id: a-refusal-names-what-objected
    statement: >
      A gate that refuses on a graded review must name which role objected, how it scored,
      and one concrete objection -- never only the narrative of a role that passed.
    source: core/work_orders/close_gates.py
    enforced_by:
      - tests/unit/test_review_failure_names_its_objection.py::test_the_score_line_names_every_role_worst_first
      - tests/unit/test_review_failure_names_its_objection.py::test_role_violations_are_findings
      - tests/unit/test_review_failure_names_its_objection.py::test_a_verdict_objecting_only_through_violations_is_not_an_incomplete_record
    note: >
      Measured on WO 17f20d48: completion scored 1.0 and wrote the only prose in the
      verdict; correctness (0.786) and quality (0.62) recorded violations and no summary.
      The gate printed "review failed - Both tasks are implemented end-to-end ... both
      resolve and pass", which reads as a broken gate rather than a real finding and cost a
      reader twenty minutes concluding exactly that. The verdict was right; the sentence it
      chose came from the one role with nothing to report. Role violations now count as
      findings -- they did not, so a verdict objecting only through them had an EMPTY
      findings list and risked being reported as an incomplete record, softening a real
      failure into inconclusive.
