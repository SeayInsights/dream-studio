# Which skill modes have a specialist subagent, and which deliberately do not.
#
# ENFORCE OR DECLARE. Every mode under canonical/skills/**/modes/*/SKILL.md appears here
# exactly once: it either names the agent compiled from it, or says in writing why it has
# none. The `agent-coverage` gate refuses a mode in neither state, so a new specialist
# mode cannot ship with nobody able to answer it and nobody having decided that was right.
#
# THE RULE. AN AGENT EXISTS TO BE DISPATCHED, so a mode earns one when something actually
# dispatches it, or when it is big enough that isolating it protects the caller's context:
#
#   1. FAN-OUT -- several modes share a trigger word, so one operator word convenes them
#      together and they run in parallel. Measured: `audit:` is the only such set, routing
#      to code-quality, database, security, testing and types-deps.
#   2. ISOLATION -- the skill is at least 5000 bytes (~1,250 tokens). Below that the
#      wrapper (frontmatter, scope, output contract, ~1.2 KB) rivals the knowledge, and a
#      round trip costs the caller more context than reading the skill inline.
#
# A mode meeting neither is read inline by the skill that owns its flow. A mode that owns
# state, sequence, or a conversation with the operator never gets one: a subagent cannot
# hold a lifecycle step, because the step IS the caller's process. A router has no question
# of its own.
#
# THE THRESHOLD WAS NOT CHOSEN TO HIT A NUMBER. 5000 bytes is the lowest value that
# reproduces all nine agents this repository already shipped -- the previous author's
# judgement agreeing with the rule, arrived at independently.
#
# `description` comes from the mode's own metadata.yml (a purpose line plus the triggers
# that route to it), both authored for routing. Generated names follow <pack>-<mode>; the
# nine that predate this file keep the names they ship under, because renaming one breaks
# every dispatch that calls it.

