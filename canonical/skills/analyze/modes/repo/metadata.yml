  times_used: 0
  success_rate: 0.0
  avg_token_usage: 0
  avg_execution_time_seconds: 0
  last_success: null
  last_failure: null

# Failure patterns
common_failures: []

# Dependencies. Pack-relative paths are inside the analyze skill directory; this mode
# reads nothing outside it and imports no Dream Studio module. It clones remote repositories
# with git when given a URL.
dependencies:
  core_modules: []
  tools_required: [python, git]
  env_vars_required: []
  files_required:
    - repo-analyzer.py
    - repo_analysis/
    - domains/
    - analyze_core/
  calls_skills: [ds-analyze:multi]   # hands its results to multi evaluate-strategy; same pack

# Compatibility
compatibility:
  min_context_window: 100000
  works_best_with: sonnet
  works_with: [haiku, sonnet, opus]
  platforms: [windows, macos, linux]

# Discovery. Left empty on purpose: this mode's triggers are declared in SKILL.md, and
# listing them here as well would change what the router and the compiled keyword table
# say for a mode this file was only added to describe the dependencies of.
tags: [analysis, repository, patterns]
category: analysis
triggers: []
description: "Repository pattern analysis and cross-repo comparison"
