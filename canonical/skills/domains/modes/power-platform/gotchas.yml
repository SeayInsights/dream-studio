version: 1.1

avoid:
  - id: custom-visual-hardcoded-colors
    severity: high
    discovered: 2026-10-01
    title: "Never hardcode hex colors in a custom (pbiviz) visual's series rendering"
    context: "A custom visual that writes colors[i] = '#118DFF' (or any fixed hex) for data-driven series ignores the report's active theme/brand profile entirely — every engagement's report looks wrong, and swapping brand profiles requires rebuilding the visual."
    fix: "Use host.colorPalette.getColor(seriesName).value for anything data-driven. Chrome (borders, dimmed states) can stay hardcoded to the active brand profile's value. See ../../powerbi/custom-visuals.md Theme-Aware Colors section."

  - id: custom-visual-missing-data-reduction
    severity: critical
    discovered: 2026-10-01
    title: "capabilities.json dataViewMappings without dataReductionAlgorithm crashes on large data"
    context: "Without a cap, Power BI tries to deliver the full row count to the visual; it works fine in a small test dataset and crashes or hangs once real data volume hits it."
    fix: "Add dataReductionAlgorithm (e.g. { top: { count: 500 } }) to every categories/rows/columns mapping. See ../../powerbi/custom-visuals.md capabilities.json section."

  - id: visual-filters-not-hidden
    severity: critical
    discovered: 2026-10-01
    title: "Visual-level filters must always set isHiddenInViewMode:true"
    context: "Power BI Desktop auto-creates a filterConfig.filters[] entry per bound field, visible by default in the 'Filters on this visual' pane — a developer-side artifact, never a user-facing control. A readable (non-hex) filter name also causes Power BI to silently reject the filter and render the visual blank."
    fix: "Run scripts/hide-visual-filters.mjs then scripts/preemptive-hide-fields.mjs after every Desktop save session. Filter names must be 20-char lowercase hex. See ../../powerbi/pbir-gotchas.md #7."

  - id: pivottable-missing-selector
    severity: high
    discovered: 2026-10-01
    title: "pivotTable styling objects need selector:{id:\"default\"} or Power BI silently ignores them"
    context: "Without the selector, Power BI Desktop falls back to the active theme for that property block even though the visual.json explicitly sets a value — no error, just a wrong render. tableEx does NOT have this requirement; this is pivotTable-specific."
    fix: "Add \"selector\": { \"id\": \"default\" } as a sibling of \"properties\" on grid, columnHeaders, rowHeaders (first entry), values, and total. See ../../powerbi/pbir-gotchas.md #3."

  - id: tmdl-standalone-block-comments
    severity: critical
    discovered: 2026-10-01
    title: "Standalone /* */ block comments between TMDL objects break the whole model load"
    context: "The TMDL parser rejects a standalone block comment between objects with InvalidLineType: Unexpected line type: Other! — Power BI Desktop then refuses to load the entire .pbip and shows the blank 'Add data to your report' welcome screen instead of a clear error."
    fix: "Use /// description annotations immediately above an object instead of section-header block comments. /* */ is only valid inside a DAX expression body. See ../../powerbi/pbir-gotchas.md T1."

  - id: visualcontainerobjects-top-level
    severity: critical
    discovered: 2026-10-01
    title: "visualContainerObjects must be nested under visual, never a top-level sibling"
    context: "Placing visualContainerObjects (background/border/padding/title) as a top-level key next to position and visual fails schema validation on .pbip open with an 'additional properties not allowed' error."
    fix: "Nest it as visual.visualContainerObjects, alongside visual.objects and visual.query. See ../../powerbi/pbir-gotchas.md #1."

  - id: visual-header-hidden-kills-export
    severity: high
    discovered: 2026-10-01
    title: "Hiding a data visual's header removes Export data in the Service"
    context: "visualContainerObjects.visualHeader show:false removes the entire on-hover header in Service reading view, including the only path to Export data. The regression is invisible while authoring because Desktop edit mode always shows headers regardless of this setting — it only bites the published report."
    fix: "Keep the header on for any data-bearing visual (tables, matrices, charts, data-bound custom visuals); de-noise it by suppressing individual icons while keeping showOptionsMenu:true. See ../../powerbi/pbir-gotchas.md #15."

  - id: pbip-inline-edit
    severity: critical
    discovered: 2026-04-28
    title: "Never embed .pbip / TMDL reference content in SKILL.md"
    context: "Embedded content bloats the skill and makes it hard to update. .pbip format belongs in powerbi/pbip-format.md."
    fix: "Reference the file: 'See: powerbi/pbip-format.md' — don't copy the content inline."

  - id: bi-work-inline
    severity: critical
    discovered: 2026-04-28
    title: "Never handle Power BI .pbip, TMDL, or semantic model work inline"
    context: "The powerbi/ reference files carry the .pbip, TMDL, DAX and M-query rules. Working from memory produces errors."
    fix: "Read ../../powerbi/pbip-format.md and ../../powerbi/tmdl-authoring.md before any .pbip editing, TMDL syntax, DAX diagnosis, or semantic model validation."

  - id: report-json-edit
    severity: critical
    discovered: 2026-04-28
    title: "Never manually edit report.json in a .pbip project"
    context: "Power BI generates and owns report.json. Manual edits corrupt the file."
    fix: "Only edit .tmdl files, .pbip, .pbir, and .pbism. Let Power BI Desktop own report.json."

  - id: tmdl-tabs
    severity: high
    discovered: 2026-04-28
    title: "TMDL indentation must be tabs — never spaces"
    context: "TMDL is whitespace-sensitive. Space-indented lines cause silent parse failures when Power BI Desktop opens the file. (This entry previously said the opposite — corrected 2026-10-01 to match ../../powerbi/pbip-format.md and this file's own SKILL.md anti-patterns table, both of which have always said tabs.)"
    fix: "Always use tab indentation in .tmdl files. Check editor settings before writing TMDL."

  - id: page-visibility-invalid
    severity: critical
    discovered: 2026-04-29
    title: "Do NOT add 'visibility' to page.json — invalid in page/2.0.0/schema.json"
    context: "Adding 'visibility': 'HiddenInNavigationPane' to page.json causes a schema validation error and PBI Desktop refuses to load the report."
    fix: "To hide a page: open PBI Desktop, right-click the page tab → 'Hide page'. PBI writes the correct config itself."

  - id: sortbycol-circular
    severity: high
    discovered: 2026-04-29
    title: "sortByColumn creates circular dependency if the sort column is derived from the same column"
    context: "Setting sortByColumn to a calculated column (e.g. 'Severity Sort = SWITCH([severity], ...)') that references the sorted column creates a cycle PBI refuses to load. The Age Bucket Sort pattern works because it sorts a different base column."
    fix: "Remove sortByColumn from the data model. Use sortDefinition in the visual JSON instead — sort by the sort column in the visual query, not in the model."

  - id: filterconfig-manual
    severity: medium
    discovered: 2026-04-29
    title: "Never write filterConfig manually in visual JSON — PBI auto-manages it"
    context: "PBI Desktop appends filterConfig to every visual when the user saves. Hand-written filterConfig can conflict with PBI's auto-generated version."
    fix: "Omit filterConfig from all hand-authored visual JSON. PBI will add it automatically on first save."

  - id: pbi-auto-save-overwrites
    severity: high
    discovered: 2026-04-29
    title: "PBI Desktop modifies visual JSONs on save — never overwrite PBI-saved files with hand-edited versions"
    context: "After the user saves from PBI Desktop, visual JSONs contain fractional coordinates and filterConfig written by PBI. Overwriting with integer-coord hand-edited versions drops PBI's metadata."
    fix: "Always READ visual JSON files before editing if PBI Desktop has been open. Merge your changes into the PBI-saved version, not the other way around."

  - id: drillthrough-via-json
    severity: high
    discovered: 2026-04-29
    title: "Drill-through page configuration cannot be reliably authored via JSON"
    context: "PBI's drill-through schema is internal and undocumented for manual authoring. Attempting to wire it via JSON is error-prone."
    fix: "Build page visuals via JSON as normal, then configure drill-through in PBI Desktop GUI: go to target page → Visualizations pane → Fields tab → drag field to 'Drill through' well. Takes ~1 minute and is authoritative."

best_practices:
  - id: verify-order
    title: "Always verify in this order: Desktop open → Refresh → Spot-check → RLS → All pages → Publish"
    context: "Skipping the order causes false confidence — a model can look fine in Desktop but fail on publish."

  - id: read-skill-files-first
    title: "Read gotchas.yml and powerbi/ reference files before every Power BI engagement"
    context: "Reference content lives in powerbi/ subfolder. SKILL.md is behavior only."

  - id: layout-single-horizontal-band
    title: "Put all top-row visuals in ONE horizontal band at the same y — never rely on small y-gaps between rows"
    context: "PBI uses fractional pixel coordinates internally and repositions visuals on load. Stacked rows with small gaps (< 20px) collapse into overlaps after PBI repositions. Discovered 2026-04-29."
    fix: "All top-row elements: same y value, side by side. Leave ≥ 20px gap between rows. Example: top row y=10 h=100, next section y=120."

  - id: tmdl-column-ordering
    title: "PBI Desktop reorders calculated columns on save — do not fight it"
    context: "PBI moves calculated columns to the end of the column list when it saves. This is cosmetic only and does not affect functionality. Discovered 2026-04-29."

edge_cases:
  - id: tmdl-multiline-measure
    title: "TMDL multiline measure expressions"
    context: "Measure expression can be single-line OR multiline. Multiline: expression starts on the NEXT line after the measure name, indented 2 more spaces."
    example: |
      measure 'Total Sales' =
        VAR x = SUM(FactSales[SalesAmount])
        RETURN x

  - id: slicer-empty-on-open
    title: "Slicer (and all visuals) show empty after externally editing .pbip — not a config bug"
    context: "When a .pbip is edited outside PBI Desktop and reopened, PBI has not loaded the data source yet. All visuals appear blank until refresh."
    fix: "Click Home → Refresh in PBI Desktop after opening any externally-edited .pbip file."

  - id: barchart-series-stacks
    title: "Adding a Series bucket to barChart makes it stacked, not grouped"
    context: "A barChart with only Category + Y produces one bar per category (clustered/grouped). Adding a Series bucket converts it to a stacked bar chart."
    fix: "For individual bars per category: use only Category + Y buckets. Leave Series empty."

limitations:
  - id: no-report-json
    title: "Cannot generate report.json from scratch"
    context: "report.json schema is complex and Power BI-version-specific. Always let Power BI Desktop generate it."

deprecated: []
