schema_version: 2

# A trigger that reaches a COMMAND rather than a skill.
#
# WHY THIS SECTION EXISTS. Lifecycle work -- projects, milestones, work orders -- is
# commands, not skills: every operation already had a `ds` door and the packs around them
# were narration. But the words an operator types are not narration. `resume:` and
# `what's next:` were ds-project's most-used triggers, and dissolving the pack would have
# deleted the phrasing along with the prose.
#
# So a trigger may name a command. The routing hook reads this list from the same file it
# reads packs from, so there is one trigger source and not two.
command_triggers:
  - command: ds project state
    why: >
      One query for where the work stands: the active project, the next open work order,
      which gates are open, the design brief, outstanding tasks and recorded gotchas.
      This is what the ds-project pack's resume mode did, and these are its triggers.
    triggers:
      - "resume:"
      - "pick up:"
      - "get back to:"
      - "what's next:"
      - "what's active:"
      - "start project:"
      - "start building:"
      - "continue:"
      - "where was I:"
      - "what am I working on:"
      - "what should I do:"

packs:
  core:
    description: Build lifecycle — think through ship, core agents, session context
    skill: core
    invariants:
      - a claim about the tree cites the command or file it rests on
      - ship is the only mode here that reaches an irreversible step, and it stops for the operator first
    modes: [think, plan, build, review, verify, ship, handoff, recap, explain]
    agents: [director, engineering, chief-of-staff]
    context: [session-context, session-primer, director-preferences, director-corrections, fullstack-standards]
    hooks: [on-milestone-start, on-milestone-end, on-workflow-progress, on-changelog-nudge, on-stop-handoff, on-post-tool-use]

  quality:
    description: Code quality, learning, and structural discipline
    skill: quality
    invariants:
      - a finding names a file and line, or the command that produced it
      - a discovered defect is registered in the authority rather than left in prose
    modes: [debug, polish, harden, pr-security-scan, structure-audit, learn, groom, coach, audit, security, accessibility, code-quality, testing, types-deps, backend-api, frontend-ux, architecture, ops, database-compliance, pre-launch]
    hooks: [on-security-scan, on-quality-score, on-structure-check, on-agent-correction]
    rules: [structure/architecture.md, structure/fsc.md]

  analyze:
    description: Multi-perspective analysis engine
    skill: analyze
    invariants:
      - analysis leaves the working tree unchanged
      - a conclusion carries its sources, and an unverified claim is labelled unverified
    # repo and intelligence added — Flag 1 fix; research — 18.9 Tier 1; idea-validation — 18.9 Tier 2-3
    modes: [multi, domain-re, repo, intelligence, research, idea-validation]

  domains:
    description: Stack-specific and domain builders
    skill: domains
    invariants:
      - generated code stays inside the active work order's module boundary
      - a deliverable that leaves the machine stops for the operator first
    # fullstack and website — Flag 1 fix; technical-writing — 18.9 Tier 2-3
    modes: [dashboard-dev, power-platform, design, technical-writing]
    agents: [client]
    templates: [project-standards/]

  meta:
    description: Observability, session management, and shared hook infrastructure
    skill: workflow
    invariants:
      - hooks emit through the spool rather than writing authority tables directly
      - a hook that cannot run degrades to a no-op rather than blocking the session
    skill_path: canonical/skills/workflow
    # Placeholder .gitkeep dirs under packs/meta/ are intentional — Flag 6
    hooks:
      # User-facing pack hooks
      - on-pulse
      - on-meta-review
      - on-context-threshold
      - on-post-compact
      - on-token-log
      - on-tool-activity
      - on-skill-load
      - on-skill-telemetry
      # Added — Flag 5 fix
      - on-first-run
      - on-memory-retrieve
      - on-context-inject
      - on-prompt-route
      - on-prompt-validate
      - on-session-start
      - on-session-end
      - on-memory-ingest
      # Internal dispatch hooks (called via hooks.json directly, not pack routing)
      - on-prompt-dispatch
      - on-stop-dispatch
      - on-edit-dispatch
      - on-skill-complete
      - on-skill-metrics
      # Blocking enforcement hooks (direct hooks.json entries — must own stdout,
      # cannot route through the output-swallowing dispatcher)
      - on-edit-enforce
      - on-stop-enforce
    lib: hooks/lib/

  data:
    description: Data engineering and database quality — schema/query/migration audits, warehouse pipeline authoring
    skill: data
    invariants:
      - a finding names a file and line, or the command that produced it
      - a schema or migration change never destroys data without an explicit, stated reason
    # split out of quality (database) and domains (data-engineering) — pack-split, 2026-09-24
    modes: [database, data-engineering]

  infra:
    description: CI/CD, Kubernetes, and infrastructure as code — pipeline design, cluster operations, Terraform provisioning
    skill: infra
    invariants:
      - a finding names a file and line, or the command that produced it
      - a deliverable that leaves the machine stops for the operator first
    # split out of domains (devops, kubernetes, terraform) — pack-split, 2026-09-24
    modes: [devops, kubernetes, terraform]

  apps:
    description: SaaS, mobile, game, and MCP-server builders
    skill: apps
    invariants:
      - generated code stays inside the active work order's module boundary
      - a deliverable that leaves the machine stops for the operator first
    # split out of domains (saas-build, mobile, game-dev, mcp-build) — pack-split, 2026-09-24
    modes: [saas-build, mobile, game-dev, mcp-build]
    agents: [game]
    hooks: [on-game-validate]
    rules: [game/ai-code.md, game/data-files.md, game/gameplay-code.md, game/networking-code.md, game/shader-code.md, game/ui-code.md]

  security:
    description: Enterprise security analysis — automated scanning, compliance mapping, mitigation generation, network compatibility, and executive dashboards.
    skill: security
    invariants:
      - a finding states its severity and the evidence establishing it
      - scan output lands in the diagnostics home, never the repo root
    # review added — Flag 2 fix
    modes: [scan, dast, binary-scan, mitigate, comply, netcompat, dashboard, review]

  website:
    description: Website build pipeline — discovery through delivery, 9 sub-modes
    skill: ds-website
    invariants:
      - a page is built against a locked design brief
      - delivery to a client stops for the operator first
    modes: [discover, direction, page, prototype, animate, brand, cip, critique, deck]

  fullstack:
    description: Full-stack build pipeline — frontend, backend, integration, and security
    skill: ds-fullstack
    invariants:
      - frontend and backend agree on one written contract before integration
    modes: [frontend, backend, integrate, secure]

  setup:
    description: Platform setup — interactive wizard, status reporting, and JIT tool installation
    skill: ds-setup
    invariants:
      - setup converges on re-run rather than duplicating what it installed
    modes: [wizard, status, jit]

# Cross-pack assets not owned by any single pack.
shared:
  templates: [templates/traceability-registry.yaml]
  workflows: canonical/workflows/
  # feeds/ removed — directory does not exist (Flag 4 fix, ODP-5 safe default)
